<!doctype html>
<html lang="sw">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kiwanda — Msango Maduka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Kiwanda: zana ya msimamizi — orodha ya mifumo juu, kila mfumo unafunguka kwa paneli yake ya kubadilisha. */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --sunk:#E9EBE6; --ink:#17201E; --muted:#5B6863; --line:#D7DCD6;
  --accent:#0D6A5B; --accent-ink:#FFFFFF; --accent-soft:#DDEEE9;
  --good:#1D7A3B; --warn:#A86400; --bad:#B3261E; --info:#2556A3;
  --good-soft:#E1F1E5; --warn-soft:#FBEFD9; --bad-soft:#F8E1DF; --info-soft:#E1EAF7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#0E1412; --surface:#161F1C; --sunk:#1D2825; --ink:#E4EBE8; --muted:#95A49E; --line:#2B3733;
  --accent:#43B9A2; --accent-ink:#06201B; --accent-soft:#163A33;
  --good:#5DC985; --warn:#E3A43C; --bad:#F2786D; --info:#80A9F1;
  --good-soft:#173322; --warn-soft:#3A2B10; --bad-soft:#3D1A17; --info-soft:#18284A; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-bottom:env(safe-area-inset-bottom,0px)}
h1,h2,h3,h4{font-family:var(--f-display);font-stretch:85%;margin:0;text-wrap:balance}
h2{font-size:22px;font-weight:800} h3{font-size:17px;font-weight:700} h4{font-size:14px;font-weight:700;letter-spacing:.02em}
.wrap{max-width:1000px;margin:0 auto;padding-inline:16px;padding-block:16px 60px;display:grid;gap:16px}
nav.top{position:sticky;top:0;z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding-top:env(safe-area-inset-top,0px)}
nav.top .in{max-width:1000px;margin:0 auto;padding:10px 16px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:18px;text-transform:uppercase;margin-right:8px}
nav.top a{color:var(--muted);text-decoration:none;font-weight:600;padding:6px 10px;border-radius:8px;font-size:14px}
nav.top a.on{background:var(--ink);color:var(--bg)}
nav.top .sp{flex:1}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)} .note{font-size:12.5px;color:var(--muted)}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
button,.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
button:hover,.btn:hover{border-color:var(--muted)}
button:disabled{opacity:.5;cursor:not-allowed}
button:focus-visible,.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sm{font-size:13px;padding:5px 10px}
.danger{color:var(--bad)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
input[type=color]{padding:2px;height:40px;width:64px}
textarea{min-height:70px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.stat:last-child{grid-column:span 2}
@media (min-width:720px){.stats{grid-template-columns:repeat(5,minmax(0,1fr))}.stat:last-child{grid-column:auto}}
.stat{background:var(--surface);padding:12px 14px;display:grid;gap:2px}
.stat b{font-family:var(--f-mono);font-size:22px;font-weight:500}
.stat span{font-size:12px;color:var(--muted)}
.pill{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.p-trial{background:var(--info-soft);color:var(--info)} .p-paid{background:var(--good-soft);color:var(--good)}
.p-soon{background:var(--warn-soft);color:var(--warn)} .p-exp,.p-off{background:var(--bad-soft);color:var(--bad)}
.list{display:grid;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.sys{border-top:1px solid var(--line);padding:12px 14px;display:grid;gap:8px}
.sys:first-child{border-top:0}
.sys .top{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center}
.sw{width:14px;height:36px;border-radius:4px;background:var(--sunk)}
.sys .n{font-weight:600;overflow-wrap:anywhere}
.sys .m{font-size:13px;color:var(--muted)}
.editor{border-top:1px dashed var(--line);padding-top:12px;display:grid;gap:14px}
.feats{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px;background:var(--surface)}
.ck input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.ck.on{background:var(--accent-soft);border-color:transparent}
.grp{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;margin-top:4px}
.box{background:var(--sunk);border-radius:8px;padding:12px;display:grid;gap:6px;font-size:14px}
.kv{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kv span:first-child{min-width:170px;color:var(--muted);font-size:13px}
.msg{font-size:14px;padding:10px 12px;border-radius:8px}
.ok{background:var(--good-soft);color:var(--good)} .err{background:var(--bad-soft);color:var(--bad)} .wn{background:var(--warn-soft);color:var(--warn)}
pre,.mono{font-family:var(--f-mono);font-size:12px}
details summary{cursor:pointer;font-weight:700}
.center{min-height:70vh;display:grid;place-items:center}
.card{max-width:380px;width:100%;display:grid;gap:10px}
.themes{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.th{all:unset;cursor:pointer;display:grid;gap:4px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:13px;font-weight:600}
.th[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.th:focus-visible{outline:2px solid var(--accent)}
.th .sw{display:flex;height:22px;border-radius:5px;overflow:hidden}.th .sw i{flex:1}
.lgbox{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.lgprev{width:72px;height:72px;border:1px dashed var(--line);border-radius:12px;display:grid;place-items:center;background:var(--surface);overflow:hidden}
.lgprev img,.lgprev svg{width:64px;height:64px;object-fit:contain}
.swl{width:36px;height:36px;border-radius:8px;overflow:hidden;display:grid;place-items:center;background:var(--sunk)}.swl img,.swl svg{width:36px;height:36px;object-fit:contain}
.svc{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.svc:first-child{border-top:0}.svc .t{font-weight:600;font-size:14px}.svc .p{font-size:12.5px;color:var(--muted)}
.svc .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}.svc select{width:auto;font-size:13px;padding:5px 8px}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}
.lgen{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,104px),1fr))}
.lgen button{all:unset;cursor:pointer;border:2px solid var(--line);border-radius:12px;background:#fff;padding:4px;display:grid;place-items:center;aspect-ratio:1}
.lgen button:hover{border-color:var(--muted)}.lgen button[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lgen button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.lgen svg{width:100%;height:auto;display:block}
.pals{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,150px),1fr))}
.pal{all:unset;cursor:pointer;display:grid;gap:5px;padding:8px;border:1px solid var(--line);border-radius:10px;background:var(--surface);font-size:12.5px}
.pal b{font-weight:600;font-size:13px}.pal small{color:var(--muted);font-size:11px;line-height:1.3}
.pal[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.pal:focus-visible{outline:2px solid var(--accent)}
.pal-sw{display:flex;height:26px;border-radius:6px;overflow:hidden;border:1px solid var(--line)}.pal-sw i{display:block}
.pal-none{align-items:center;justify-content:center;color:var(--muted)}
.pal-dots{display:flex;gap:4px}.pal-dots i{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.12)}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11.5px;padding:2px 8px;border-radius:99px;background:var(--accent-soft);color:var(--ink)}
.leo{border-width:2px;border-color:var(--accent)}
.leo-k{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:720px){.leo-k{grid-template-columns:repeat(5,minmax(0,1fr))}}
.leo-k div{background:var(--sunk);border-radius:8px;padding:10px 12px;display:grid;gap:2px}
.leo-k b{font-family:var(--f-mono);font-size:19px;font-weight:500}.leo-k span{font-size:12px;color:var(--muted)}
.lsec{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.lsec h4{padding:8px 12px;background:var(--sunk);display:flex;justify-content:space-between;align-items:center;gap:8px}
.lrow{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:9px 12px;border-top:1px solid var(--line)}
.lrow .n{font-weight:600;font-size:14px;overflow-wrap:anywhere}.lrow .m{font-size:12.5px;color:var(--muted)}
.lrow .a{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.lrow{grid-template-columns:1fr}.lrow .a{justify-content:flex-start}}
.hai{font-size:12px;color:var(--muted)}.hai.bad{color:var(--bad)}.hai.good{color:var(--good)}
.demo-g{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,220px),1fr))}
.demo-g .box{align-content:start}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:24px;z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
</style>
</head>
<body>
<nav class="top"><div class="in">
  <span class="brand">Msango Maduka</span>
  <a href="ofisi.html">📋 Ofisi</a>
  <a href="kiwanda.html" class="on">🏭 Kiwanda</a>
  <a href="katalogi.html">💎 Katalogi</a>
  <span class="sp"></span>
  <span id="who" class="note"></span>
</div></nav>
<main class="wrap" id="app"><div class="center"><p class="muted">Inapakia…</p></div></main>
<div id="toast" class="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="duka.js?v=15"></script>
<script src="logo-gen.js?v=2"></script>
<script src="demo.js?v=1"></script>
<script>
firebase.initializeApp(firebaseConfig);
const db = firebase.firestore();
const auth = firebase.auth();
const $ = (s) => document.querySelector(s);
const esc = dukaEsc;
const tzs = (n) => "TZS " + Math.round(+n || 0).toLocaleString("en-US");
function toast(m) { const t = $("#toast"); t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2800); }

const K = { user: null, shops: [], loaded: false, open: location.hash.slice(1) || null, tab: {}, edit: {}, creds: {}, created: null, msg: "", ok: true, busy: false,
  showNew: false, form: null, pub: {}, clients: {}, login: { email: "", pw: "", msg: "" }, hai: {}, haiAt: 0, staff: null };
const OWNER = () => IS_ADMIN && !IS_STAFF;          // mmiliki (Eric) — bei, muda, kufuta, mipangilio
const realShops = () => K.shops.filter((s) => !s.demo);
function blankForm() {
  return { name: "", code: "", _codeTouched: false, email: "", pw: genPw(), phone: "", location: "", owner: "", edition: "duka",
    features: presetFeatures("duka"), users: EDITIONS.duka.users, monthly: EDITIONS.duka.price, color: "#0d6a5b", tagline: "",
    theme: "asili", industry: "spea", addons: [], logo: "",
    trialDays: (K.pub && K.pub.trialDays) || 14, notes: "", clientId: "", referredBy: "" };
}
function genPw() { const a = "abcdefghjkmnpqrstuvwxyz23456789"; let s = ""; for (let i = 0; i < 8; i++) s += a[Math.floor(Math.random() * a.length)]; return s; }

/* ---------- status ya mfumo ---------- */
function status(s) {
  if (s.active === false) return ["p-off", "Imesimamishwa"];
  const dl = daysLeft(s);
  if (dl == null || dl <= 0) return ["p-exp", "Muda umeisha"];
  if (s.trialEnds && s.paidUntil <= s.trialEnds) return ["p-trial", "Majaribio · siku " + dl];
  if (dl <= 5) return ["p-soon", "Inaisha · siku " + dl];
  return ["p-paid", "Imelipiwa · siku " + dl];
}

/* ---------- data ---------- */
let unsub = null;
function listen() {
  if (unsub) return;
  unsub = db.collection("shops").onSnapshot((snap) => {
    K.shops = snap.docs.map((d) => ({ code: d.id, ...d.data() })).sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
    const first = !K.loaded; K.loaded = true; K.denied = false;
    if (first) loadHai();
    // mifumo ya zamani isiyo na muda wa malipo → ipe siku 14 za majaribio
    if (OWNER()) K.shops.filter((s) => !s.paidUntil).forEach((s) => db.collection("shops").doc(s.code).update({ paidUntil: Date.now() + 14 * DAY, trialEnds: Date.now() + 14 * DAY }).catch(() => {}));
    render();
  }, (e) => { K.loaded = true; K.denied = e && e.code === "permission-denied"; render(); });
  db.collection("settings").doc("public").onSnapshot((d) => { K.pub = (d.exists && d.data()) || {}; render(); }, () => {});
  if (OWNER()) db.collection("settings").doc("staff").onSnapshot((d) => { K.staff = (d.exists && d.data()) || { emails: [], names: {} }; render(); }, () => {});
  db.collection("clients").onSnapshot((snap) => { const m = {}; snap.forEach((d) => (m[d.id] = { id: d.id, ...d.data() })); K.clients = m; render(); }, () => {});
}

/* ---------- views ---------- */
function vLogin() {
  const f = K.login;
  return `<div class="center"><div class="card panel">
    <h2>Kiwanda</h2><p class="note">Ingia kwa email ya msimamizi.</p>
    <input id="lg-email" type="email" placeholder="Email" value="${esc(f.email)}" oninput="K.login.email=this.value">
    <input id="lg-pw" type="password" placeholder="Password" oninput="K.login.pw=this.value" onkeydown="if(event.key==='Enter')doLogin()">
    ${f.msg ? `<div class="msg err">${esc(f.msg)}</div>` : ""}
    <button class="pri" onclick="doLogin()">Ingia</button>
    <button onclick="dukaForgot(K.login.email)">Umesahau password?</button></div></div>`;
}
function doLogin() { auth.signInWithEmailAndPassword(K.login.email.trim(), K.login.pw).catch((e) => { K.login.msg = /wrong|invalid|not-found/.test(e.code || "") ? "Email au password si sahihi." : (e.message || "Imeshindikana"); render(); }); }

function vStats() {
  const S = realShops(), st = S.map(status);
  const n = (c) => st.filter(([k]) => k === c).length;
  const mrr = S.filter((s, i) => st[i][0] === "p-paid" || st[i][0] === "p-soon").reduce((a, s) => a + (s.monthly || 0), 0);
  return `<div class="stats">
    <div class="stat"><span>Mifumo yote</span><b>${S.length}</b></div>
    <div class="stat"><span>Imelipiwa</span><b style="color:var(--good)">${n("p-paid") + n("p-soon")}</b></div>
    <div class="stat"><span>Majaribio</span><b style="color:var(--info)">${n("p-trial")}</b></div>
    <div class="stat"><span>Inaisha ≤ siku 5</span><b style="color:var(--warn)">${n("p-soon")}</b></div>
    <div class="stat"><span>Imeisha / imesimamishwa</span><b style="color:var(--bad)">${n("p-exp") + n("p-off")}</b></div>
  </div><div class="note">Mapato ya mwezi kutoka mifumo iliyolipiwa: <b class="num">${tzs(mrr)}</b>${svcTotals()}</div>`;
}

function featBoxes(features, onchange) {
  let grp = "";
  return `<div class="feats">${FEATURES.map(([k, label, g]) => {
    const head = g !== grp ? ((grp = g), `<div class="grp" style="grid-column:1/-1">${g === "POS" ? "🛒 POS (mauzo)" : "📚 Wadai na Stock"}</div>`) : "";
    return head + `<label class="ck ${features[k] ? "on" : ""}"><input type="checkbox" ${features[k] ? "checked" : ""} onchange="${onchange}('${k}',this.checked)"><span>${label}</span></label>`;
  }).join("")}</div>`;
}

function themePicker(cur, fn) {
  return `<div class="themes">${Object.entries(THEMES).map(([k, t]) => `<button class="th" aria-pressed="${cur === k}" onclick="${fn}('${k}')">
    <span class="sw"><i style="background:${t.side}"></i><i style="background:${t.accent}"></i><i style="background:${t.accent2}"></i><i style="background:${t.bg}"></i></span>
    ${esc(t.name)}${t.tier === "premium" ? " 💎" : ""}</button>`).join("")}</div>`;
}
/* 🎨 seti ya rangi 3 (60‑30‑10) — ikichaguliwa inashinda muundo */
function palettePicker(cur, fn) {
  const card = (k, t) => `<button class="pal" aria-pressed="${cur === k}" onclick="${fn}('${k}')" title="${t ? esc(t.name) : "Hakuna seti"}">
    ${t ? `<span class="pal-sw"><i style="flex:6;background:${t.bg}"></i><i style="flex:3;background:${t.side}"></i><i style="flex:1;background:${t.accent}"></i></span>
    <span class="pal-dots"><i style="background:${t.c[0]}"></i><i style="background:${t.c[1]}"></i><i style="background:${t.c[2]}"></i></span>` : `<span class="pal-sw pal-none">—</span>`}
    <b>${t ? esc(t.name) : "Hakuna (tumia muundo)"}</b>${t ? `<small>${esc(PALETTES.find((x) => x[0] === k)[5])}</small>` : ""}</button>`;
  return `<div class="grp" style="margin-top:6px">🎨 Seti ya rangi 3 — kanuni ya 60‑30‑10</div>
    <div class="note">60% mandhari · 30% rangi kuu (pembeni na kadi) · 10% msisitizo (vitufe na ikoni). Ukichagua seti, inashinda muundo hapo juu.</div>
    <div class="pals">${card("", null)}${PALETTES.map(([k]) => card(k, paletteTheme(k))).join("")}</div>`;
}
function industrySelect(cur, onchange) {
  return `<select onchange="${onchange}">${Object.entries(INDUSTRIES).map(([k, x]) => `<option value="${k}" ${cur === k ? "selected" : ""}>${esc(x.name)}${k === "spea" ? " (Wadai + POS)" : " (pakiti maalum)"}</option>`).join("")}</select>`;
}
function vNew() {
  const f = K.form || (K.form = blankForm());
  const editionOpts = Object.entries(EDITIONS).map(([k, e]) => `<option value="${k}" ${f.edition === k ? "selected" : ""}>${e.name} — ${tzs(e.price)}/mwezi</option>`).join("");
  return `<div class="panel">
    <div class="row" style="justify-content:space-between"><h3>＋ Mfumo mpya</h3><button class="sm" onclick="K.showNew=false;render()">Funga</button></div>
    ${f.clientId ? `<div class="msg ok">Kutoka Ofisi: taarifa za mteja zimejazwa. Ukitengeneza, rekodi yake ya Ofisi itaunganishwa yenyewe.</div>` : ""}
    <h4>1. Mteja</h4>
    <div class="form">
      <label class="f">Jina la duka<input id="nf-name" value="${esc(f.name)}" oninput="nf('name',this.value)" placeholder="mf. Kirumba Spare Centre"></label>
      <label class="f">Code (inakuwa sehemu ya link)<input id="nf-code" value="${esc(f.code)}" oninput="nf('code',this.value)" placeholder="kirumba-spare"></label>
      <label class="f">Mwenye duka<input id="nf-owner" value="${esc(f.owner)}" oninput="nf('owner',this.value)"></label>

function nf(k, v) {

}
function nfEdition(e) { const f = K.form; f.edition = e; f.features = presetFeatures(e); f.users = EDITIONS[e].users; f.monthly = EDITIONS[e].price; render(); }
function nfFeat(k, on) { K.form.features[k] = on; render(); }
function nfTheme(k) { K.form.theme = k; render(); }
function nfPal(k) { K.form.palette = k; render(); }

async function createShop() {
  const f = K.form; K.busy = true; K.msg = "Inatengeneza…"; K.ok = true; render();
  try {
    const r = await adminCreateShop({ ...f, brand: { color: f.color, tagline: f.tagline, theme: f.theme, logo: f.logo || "", palette: f.palette || "" } });
    K.created = r; K.form = null; K.showNew = false; K.msg = ""; K.open = r.code; location.hash = r.code;
    toast("✅ Mfumo wa " + r.name + " umetengenezwa");
  } catch (e) {
    const c = (e && e.code) || "";
    K.msg = c === "permission-denied" ? "Firebase imekataa — weka rules mpya (Mipangilio hapa chini) kisha jaribu tena."
      : c.includes("operation-not-allowed") ? "Washa Email/Password kwenye Firebase → Authentication."
      : c.includes("weak-password") ? "Password ni dhaifu (herufi 6+)." : (e && e.message) || "Imeshindikana";
    K.ok = false;
  }
  K.busy = false; render();
}

async function saveFeatures(code) {

}
async function saveBrand(code) {

  try { await adminUpdateShop(code, { name: E.name, brand: { color: E.color, tagline: E.tagline, theme: E.theme, logo: E.logo || "", palette: E.palette || "" }, industry: E.industry, phone: E.phone, location: E.location }); toast("✅ Muundo na chapa vimehifadhiwa — mteja ataona akifungua upya"); }

}
async function setActive(code, on) {

}
async function setUntil(code) {

async function delShop(code) {
  const typed = (($("#del-" + code) || {}).value || "").trim().toLowerCase();

  if (typed !== code) return say("Andika code \"" + code + "\" kwenye kisanduku kwanza, kisha bonyeza Futa.", false);

}

/* ---------- 🔑 kuingia ---------- */
async function loadCreds(code) {
  K.creds[code] = { loading: true }; render();
  try {
    const col = db.collection("shops").doc(code).collection("data");
    const [m, p] = await Promise.all([col.doc("data").get(), col.doc("pos_settings").get()]);
    const sh = K.shops.find((x) => x.code === code); let pk = [];
    if (sh && isPackShop(sh)) { const q = await col.where("t", "==", "user").get(); pk = q.docs.map((d) => ({ id: d.id, ...d.data() })).filter((u) => u.active !== false); }
    K.creds[code] = { appPw: ((m.exists && m.data().settings) || {}).appPassword || "", users: ((p.exists && p.data().users) || []).filter((u) => u.active !== false), pk };
  } catch (e) { K.creds[code] = { err: e.message || "Imeshindikana" }; }
  render();
}
function vCreds(s) {
  const c = K.creds[s.code];
  if (!c) { setTimeout(() => loadCreds(s.code), 0); return `<p class="muted">Inapakia…</p>`; }
  if (c.loading) return `<p class="muted">Inapakia…</p>`;
  if (c.err) return `<div class="msg err">${esc(c.err)}</div>`;
  const em = s.ownerEmail || (s.members || [])[0] || "";
  return `<div class="box">
    <div class="kv"><span>Email ya kuingia</span><b class="mono">${esc(em)}</b></div>
    <div class="kv"><span>Password ya kuingia</span><b class="mono">${s.loginPw ? esc(s.loginPw) : "haijulikani"}</b>

function dukaForgotFor(email) { auth.sendPasswordResetEmail(email).then(() => toast("📧 Link imetumwa kwa " + email)).catch((e) => toast("Haikutumwa: " + (e.message || ""))); }
function noteLoginPw(code) { const pw = (prompt("Password uliyokubaliana na mteja (kumbukumbu yako):") || "").trim(); if (pw) adminUpdateShop(code, { loginPw: pw }).then(() => toast("✅ Imehifadhiwa")); }
async function setAppPw(code) {

async function setPin(code, uid, name) {
  const pin = (prompt("PIN mpya ya " + name + " (namba 4–6):") || "").trim(); if (!pin) return;
  if (!/^\d{4,6}$/.test(pin)) return toast("PIN iwe namba 4 hadi 6");
  const ref = db.collection("shops").doc(code).collection("data").doc("pos_settings");
  const users = (((await ref.get()).data() || {}).users || []).map((u) => ({ ...u }));
  const u = users.find((x) => x.id === uid); if (!u) return toast("Mtumiaji hakupatikana");
  u.pinHash = await dukaPinHash(uid, pin);
  await ref.set({ users }, { merge: true }); toast("✅ PIN ya " + name + " sasa ni " + pin); loadCreds(code);
}
async function packPin(code, uid) {
  const pin = (($("#pkpin-" + uid) || {}).value || "").trim();
  if (!/^\d{4,6}$/.test(pin)) return toast("PIN iwe namba 4 hadi 6");
  const data = new TextEncoder().encode("pk:" + uid + ":" + pin), h = await crypto.subtle.digest("SHA-256", data);
  const hash = Array.from(new Uint8Array(h)).map((x) => x.toString(16).padStart(2, "0")).join("");
  try { await db.collection("shops").doc(code).collection("data").doc(uid).update({ pinHash: hash, at: Date.now() }); toast("✅ PIN mpya ni " + pin); loadCreds(code); } catch (e) { toast("Haikuhifadhika: " + (e.message || "")); }
}
function addMember(code) {

async function loadErrors() {
  K.err = { loading: true }; render();
  try { const q = await db.collection("errors").orderBy("at", "desc").limit(300).get(); K.err = { list: q.docs.map((d) => ({ id: d.id, ...d.data() })) }; }
  catch (e) { K.err = { msg: e.code === "permission-denied" ? "Weka rules mpya (Mipangilio ya Kiwanda → Rules) kisha jaribu tena." : e.message || "Imeshindikana" }; }
  render();
}
function errGroups() {
  const g = {}; (K.err.list || []).forEach((e) => { const k = e.type === "report" ? e.id : e.type + "|" + e.shop + "|" + e.msg; (g[k] = g[k] || { ...e, n: 0, ids: [], last: 0 }); g[k].n++; g[k].ids.push(e.id); g[k].last = Math.max(g[k].last, e.at || 0); });
  return Object.values(g).sort((a, b) => (b.type === "report") - (a.type === "report") || b.last - a.last);
}
function errText() {
  return "Hitilafu za Msango Maduka (" + new Date().toLocaleString("sw-TZ") + ")\n\n" + errGroups().map((e, i) => `${i + 1}. [${e.type === "report" ? "RIPOTI YA MTEJA" : "ERROR ×" + e.n}] ${e.shopName || e.shop} (${e.industry || "?"}) · ${e.page} · ${e.ver || ""}\n   ${e.msg}${e.src ? "\n   @ " + e.src : ""}${e.stack ? "\n   " + e.stack.split("\n").slice(0, 3).join(" | ") : ""}${e.phone ? "\n   Simu: " + e.phone : ""}\n   Mara ya mwisho: ${new Date(e.last).toLocaleString("sw-TZ")} · ${e.who}${e.staff ? " (" + e.staff + ")" : ""}`).join("\n\n");
}
async function delErrors(ids) {
  try { const b = db.batch(); ids.slice(0, 450).forEach((id) => b.delete(db.collection("errors").doc(id))); await b.commit(); toast("🗑️ Imefutwa"); loadErrors(); } catch (e) { toast("Haikufutika: " + (e.message || "")); }
}
function vErrors() {

  return `<details class="panel" open>${head}
    <div class="row"><button class="sm" onclick="loadErrors()">↻ Onyesha upya</button>${G.length ? `<button class="sm pri" onclick="const t=document.getElementById('errtxt');t.value=errText();copy('errtxt')">📋 Nakili kwa Claude</button>${OWNER() ? `<button class="sm" onclick="if(confirm('Futa zote?'))delErrors(K.err.list.map(e=>e.id))">🗑️ Futa zote</button>` : ""}` : ""}</div>

/* mfumo wa zamani bila rekodi ya Ofisi → itengeneze na uiunganishe (data ya mfumo haiguswi) */
async function linkClient(code) {
  const s = K.shops.find((x) => x.code === code); if (!s) return;
  K.busy = true; render();
  try {
    const id = s.clientId || "c" + Date.now().toString(36), ref = db.collection("clients").doc(id), d = await ref.get();
    const paid = s.paidUntil > Date.now() && !(s.trialEnds && s.paidUntil <= s.trialEnds);
    const day = new Date(s.createdAt || Date.now()).toISOString().slice(0, 10);
    if (!d.exists) await ref.set({ id, name: s.name, owner: "", phone: s.phone || "", location: s.location || "", type: (INDUSTRIES[s.industry] || INDUSTRIES.spea).name, helper: "",
      stage: paid ? "paid" : "trial", createdAt: day, demoAt: day, trialAt: day, needs: {}, addons: [], payments: [], onboard: {}, setupFee: null, discount: 0,
      notes: s.notes || "", shopCode: code, edition: s.edition || "duka", updatedAt: Date.now() });
    else await ref.set({ shopCode: code, updatedAt: Date.now() }, { merge: true });
    if (s.clientId !== id) await adminUpdateShop(code, { clientId: id });
    toast("✅ " + s.name + " imeunganishwa na Ofisi");
  } catch (e) { toast("Haikuunganishwa: " + (e.message || "")); }
  K.busy = false; render();
}
async function svcSave(code, fn) {
  const s = K.shops.find((x) => x.code === code), c = s && K.clients[s.clientId]; if (!c) return;
  const addons = JSON.parse(JSON.stringify(c.addons || [])); fn(addons);
  try { await db.collection("clients").doc(c.id).set({ addons, updatedAt: Date.now() }, { merge: true }); } catch (e) { toast("Haikuhifadhika: " + (e.message || "")); }
}

const HAI_START = Date.parse("2026-10-26T00:00:00+03:00");   // ufuatiliaji ulianza — kabla ya hapo hakuna taarifa
const daysAgo = (ms) => (ms ? Math.max(0, Math.floor((Date.now() - ms) / DAY)) : null);
async function loadHai() {
  const S = realShops(); K.haiBusy = true; render();
  const res = await Promise.all(S.map((s) => db.collection("shops").doc(s.code).collection("data").doc("_hai").get()
    .then((d) => [s.code, d.exists ? d.data() : null]).catch(() => [s.code, undefined])));

function sales7(h) {
  if (!h) return 0; let n = 0;
  for (let i = 0; i < 7; i++) { const d = new Date(Date.now() - i * DAY); n += +h["s_" + d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0")] || 0; }
  return n;
}
function haiInfo(s) {
  if (!(s.code in K.hai)) return null;            // bado haijasomwa
  const h = K.hai[s.code], seen = h && h.seen, sale = h && h.sale, ds = daysAgo(seen), dsl = daysAgo(sale);
  const track = daysAgo(Math.max(s.createdAt || 0, HAI_START)) || 0;   // siku tulizoweza kuona
  let sleep = "", lvl = 0;
  if (!seen) { if (track >= 5) { sleep = "Hajafungua mfumo kwa siku " + track; lvl = 2; } }
  else if (ds >= 5) { sleep = "Hajafungua mfumo siku " + ds; lvl = 2; }
  else if (!sale && track >= 5) { sleep = "Anafungua, lakini hajarekodi mauzo"; lvl = 1; }
  else if (sale && dsl >= 5) { sleep = "Anafungua, lakini hajauza siku " + dsl; lvl = 1; }
  return { seen, sale, ds, dsl, s7: sales7(h), sleep, lvl };
}
function haiLine(s) {
  const i = haiInfo(s); if (!i) return "";

}

/* ---------- 📅 LEO: kila kitu kinachohitaji hatua leo, mahali pamoja ---------- */
const isTrialShop = (s) => !!(s.trialEnds && s.paidUntil <= s.trialEnds);
function leoData() {
  const S = realShops(), live = (s) => s.active !== false;
  const due = S.filter((s) => live(s) && !isTrialShop(s)).map((s) => ({ s, dl: daysLeft(s) })).filter((x) => x.dl != null && x.dl <= 7 && x.dl > -30).sort((a, b) => a.dl - b.dl);
  const trial = S.filter((s) => live(s) && isTrialShop(s)).map((s) => ({ s, dl: daysLeft(s) })).filter((x) => x.dl != null && x.dl <= 3 && x.dl > -15).sort((a, b) => a.dl - b.dl);
  const sleep = S.filter((s) => live(s) && daysLeft(s) > 0).map((s) => ({ s, i: haiInfo(s) })).filter((x) => x.i && x.i.sleep).sort((a, b) => b.i.lvl - a.i.lvl);
  const svc = [];
  Object.values(K.clients || {}).forEach((c) => (c.addons || []).filter((a) => a.svc && a.status === "imekamilika")
    .forEach((a) => svc.push({ c, a, s: S.find((x) => (x.clientId && x.clientId === c.id) || x.code === c.shopCode) })));
  const refs = S.filter((s) => s.referredBy && !s.refRewarded && !isTrialShop(s) && daysLeft(s) > 0).map((s) => ({ s, r: S.find((x) => x.code === s.referredBy) })).filter((x) => x.r);
  const mrr = S.filter((s) => live(s) && !isTrialShop(s) && daysLeft(s) > 0).reduce((a, s) => a + (+s.monthly || 0), 0);
  const week = due.filter((x) => x.dl <= 7).reduce((a, x) => a + (+x.s.monthly || 0), 0);
  const svcSum = svc.reduce((a, x) => a + (+x.a.price || 0), 0);
  return { due, trial, sleep, svc, refs, mrr, week, svcSum };
}

/* ---------- 💾 backup ya kila mteja (na kurudisha) ---------- */
function dlJson(obj, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(obj)], { type: "application/json" })); a.download = name;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500);
}
async function shopDump(code) {
  const s = K.shops.find((x) => x.code === code) || {}, snap = await db.collection("shops").doc(code).collection("data").get();
  const docs = {}; snap.forEach((d) => (docs[d.id] = d.data()));
  const shop = { ...s }; delete shop.loginPw;
  return { app: "msango-maduka", v: 1, code, name: s.name || code, industry: s.industry || "spea", at: Date.now(), shop, docs };
}
async function backupShop(code) {
  K.bk = { code, busy: true, msg: "Inapakua data…" }; render();
  try {
    const d = await shopDump(code); dlJson(d, `backup-${code}-${dukaToday()}.json`);
    K.bk = { code, msg: `✅ Backup imepakuliwa — hati ${Object.keys(d.docs).length}. Ihifadhi Google Drive.` };
    if (OWNER()) adminUpdateShop(code, { lastBackup: Date.now() }).catch(() => {});
  } catch (e) { K.bk = { code, err: true, msg: "Imeshindikana: " + (e.message || "") }; }
  render();
}
async function restoreShop(code, input) {
  const f = input.files && input.files[0]; input.value = ""; if (!f) return;
  let d; try { d = JSON.parse(await f.text()); } catch (e) { return toast("Faili si backup sahihi (JSON)"); }
  if (d && d.all && Array.isArray(d.shops)) d = d.shops.find((x) => x.code === code) || d.shops[0];
  if (!d || d.app !== "msango-maduka" || !d.docs) return toast("Faili hili si backup ya Msango Maduka");
  const typed = (($("#rs-" + code) || {}).value || "").trim().toLowerCase();
  if (typed !== code) return toast(`Andika code "${code}" kwenye kisanduku kwanza`);
  if (d.code !== code && !confirm(`Backup hii ni ya "${d.name || d.code}", si ya mfumo huu. Uirudishe HAPA hata hivyo?`)) return;
  const n = Object.keys(d.docs).length;
  if (!confirm(`Rudisha hati ${n} kutoka backup ya ${new Date(d.at).toLocaleString("sw-TZ")}?\nKwanza nitapakua backup ya hali ya sasa (usalama).`)) return;
  K.bk = { code, busy: true, msg: "Inahifadhi hali ya sasa kwanza…" }; render();
  try {
    dlJson(await shopDump(code), `kabla-ya-kurudisha-${code}-${dukaToday()}.json`);
    const col = db.collection("shops").doc(code).collection("data"); let i = 0;
    for (const [id, doc] of Object.entries(d.docs)) { await col.doc(id).set(doc); if (++i % 20 === 0) { K.bk.msg = `Inarudisha… ${i}/${n}`; render(); } }
    K.bk = { code, msg: `✅ Hati ${n} zimerudishwa. Mwambie mteja afunge mfumo na kuufungua upya.` };
  } catch (e) { K.bk = { code, err: true, msg: "Haikurudishwa: " + (e.message || "") }; }
  render();
}
function vBackup(s) {
  const b = K.bk && K.bk.code === s.code ? K.bk : null;
  return `<div class="box"><b>⬇️ Pakua backup ya ${esc(s.name)}</b>
      <span class="note">Data yote ya duka — bidhaa, stock, mauzo, madeni, wafanyakazi na picha — kwenye faili moja. Ihifadhi Google Drive au flash.${s.lastBackup ? " Backup ya mwisho: " + fmtDate(s.lastBackup) + "." : ""}</span>
      <div class="row"><button class="pri" ${b && b.busy ? "disabled" : ""} onclick="backupShop('${s.code}')">⬇️ Pakua backup</button></div></div>
    ${OWNER() ? `<div class="box"><b>♻️ Rudisha kutoka backup</b>
      <span class="note">Mteja akipoteza au kuharibu data: chagua faili la backup. Hati zilizo kwenye backup zinarudishwa kama zilivyokuwa; zilizoongezwa baadaye zinabaki. Kabla ya kurudisha, backup ya hali ya sasa inapakuliwa yenyewe.</span>
      <label class="f">Kuthibitisha, andika code ya mfumo: <b class="mono">${esc(s.code)}</b><input id="rs-${s.code}" autocomplete="off" placeholder="${esc(s.code)}"></label>
      <div class="row"><label class="btn sm">📂 Chagua faili la backup<input type="file" accept="application/json,.json" hidden onchange="restoreShop('${s.code}',this)"></label></div></div>` : ""}
    ${b && b.msg ? `<div class="msg ${b.err ? "err" : b.busy ? "wn" : "ok"}">${esc(b.msg)}</div>` : ""}`;
}
async function backupAll() {
  K.busy = true; render(); toast("Inapakua data ya mifumo yote…");
  try {
    const out = { app: "msango-maduka", v: 1, all: true, at: Date.now(), shops: [] };
    for (const s of realShops()) out.shops.push(await shopDump(s.code));
    dlJson(out, `backup-mifumo-yote-${dukaToday()}.json`); toast(`✅ Backup ya mifumo ${out.shops.length} imepakuliwa`);
  } catch (e) { toast("Imeshindikana: " + (e.message || "")); }
  K.busy = false; render();
}

/* ---------- 🧑‍💼 wafanyakazi wa Kiwanda (settings/staff) ---------- */
function vStaff() {
  const st = K.staff || { emails: [], names: {} }, list = st.emails || [];
  return `<h4>🧑‍💼 Wafanyakazi wa Kiwanda</h4>
    <p class="note">Mfanyakazi anaingia hapa Kiwanda kwa email yake. <b>Anaweza:</b> kutengeneza mfumo (bei ya mpango, majaribio ≤ siku 30), chapa na logo, huduma za kipekee, kuunganisha na Ofisi, PIN za POS, kupakua backup, na kufungua demo. <b>Hawezi:</b> kubadilisha bei au vipengele, kuongeza muda, kusimamisha, kufuta, kurudisha backup, kuona Ofisi wala mipangilio. Ukiongeza mfanyakazi wa kwanza, weka rules mpya (chini).</p>
    ${list.length ? `<div class="lsec">${list.map((e) => `<div class="lrow"><div><div class="n">${esc((st.names || {})[e] || e)}</div><div class="m mono">${esc(e)}</div></div><div class="a"><button class="sm danger" onclick="delStaff(${esc(JSON.stringify(e))})">Ondoa</button></div></div>`).join("")}</div>` : `<span class="note">Bado hakuna mfanyakazi.</span>`}
    <div class="form"><label class="f">Jina<input id="sf-name" autocomplete="off"></label><label class="f">Email<input id="sf-email" type="email" autocomplete="off"></label>
      <label class="f">Password ya kuanzia<input id="sf-pw" value="${esc(K.sfPw || (K.sfPw = genPw()))}"></label></div>
    <div class="row"><button onclick="addStaff()">＋ Ongeza mfanyakazi</button></div>
    ${K.staffMsg ? `<textarea id="staffmsg" readonly style="min-height:110px;font-size:13px">${esc(K.staffMsg)}</textarea><button class="sm" onclick="copy('staffmsg')">📋 Nakili ujumbe</button>` : ""}`;
}
async function addStaff() {
  const name = $("#sf-name").value.trim(), email = $("#sf-email").value.trim().toLowerCase(), pw = $("#sf-pw").value.trim();
  if (!name || !/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email)) return toast("Andika jina na email sahihi");
  if (email === ADMIN_EMAIL.toLowerCase()) return toast("Hiyo ni email yako ya mmiliki");
  if (pw.length < 6) return toast("Password iwe na herufi 6 au zaidi");
  let existed = false;
  try { const sec = dukaApp("ee-staff"); await sec.auth().createUserWithEmailAndPassword(email, pw); await sec.auth().signOut().catch(() => {}); }
  catch (e) { if (e && e.code === "auth/email-already-in-use") existed = true; else return toast("Haikuwezekana: " + (e.message || "")); }
  const st = K.staff || { emails: [], names: {} };
  try {
    await db.collection("settings").doc("staff").set({ emails: Array.from(new Set([...(st.emails || []), email])), names: { ...(st.names || {}), [email]: name } });
    K.sfPw = ""; K.setOpen = true;
    K.staffMsg = `Habari ${name}! Umeongezwa kwenye Kiwanda cha Msango Maduka.\nFungua: ${baseUrl()}kiwanda.html\nEmail: ${email}\n${existed ? "Password: ile uliyonayo tayari" : "Password: " + pw}\n— Eric, E.E.MSANGO`;
    toast("✅ " + name + " ameongezwa"); render();
  } catch (e) { toast("Haikuhifadhika: " + (e.message || "")); }
}
async function delStaff(email) {
  if (!confirm("Ondoa " + email + " kwenye Kiwanda?")) return;
  const st = K.staff || { emails: [], names: {} }, names = { ...(st.names || {}) }; delete names[email];
  try { await db.collection("settings").doc("staff").set({ emails: (st.emails || []).filter((x) => x !== email), names }); toast("Ameondolewa"); } catch (e) { toast("Haikuwezekana: " + (e.message || "")); }
}

/* ---------- 🎬 maduka ya demo ---------- */
function vDemo() {
  const has = (ind) => K.shops.find((s) => s.code === demoCode(ind));
  return `<details class="panel" ${K.demoOpen ? "open" : ""} ontoggle="K.demoOpen=this.open"><summary>🎬 Maduka ya Demo — mwonyeshe mteja</summary>
    <p class="note">Kila aina ya biashara ina duka la mfano lenye bidhaa, mauzo na ripoti. Lifungue kwenye simu yako mbele ya mteja — hauonyeshi data ya mteja mwingine. Ukimaliza, bonyeza 🔄 kurudisha data ya mfano.</p>
    <div class="demo-g">${Object.entries(INDUSTRIES).map(([k, x]) => {
      const s = has(k), busy = K.demoBusy === k;
      return `<div class="box"><b>${esc(x.name)}</b>${s ? `<span class="note">${k === "spea" ? `Wadai: password <b class="mono">${DEMO_PW}</b> · POS: PIN <b class="mono">${DEMO_PIN}</b>` : "Unaingia moja kwa moja kama msimamizi"}</span>
        <div class="row"><a class="btn sm pri" href="${systemLink(s)}" target="_blank" rel="noopener">↗ Fungua demo</a>${k === "spea" ? `<a class="btn sm" href="${shopLink(s.code, "pos.html")}" target="_blank" rel="noopener">↗ POS</a>` : ""}
        <button class="sm" ${busy ? "disabled" : ""} onclick="demoMake('${k}')">${busy ? "Inaandaa…" : "🔄 Rudisha data"}</button></div>
        <a class="note" href="${baseUrl() + TUTORIALS[k]}" target="_blank" rel="noopener">🎬 Video ya mafunzo (dk 1) ↗</a>`
        : OWNER() ? `<div class="row"><button class="sm" ${busy ? "disabled" : ""} onclick="demoMake('${k}')">${busy ? "Inatengeneza…" : "＋ Tengeneza demo"}</button></div>` : `<span class="note">Bado haijatengenezwa — mwambie Eric.</span>`}</div>`;
    }).join("")}</div>
    ${OWNER() ? `<div class="row"><button class="sm" onclick="demoAll()" ${K.demoBusy ? "disabled" : ""}>⚡ Tengeneza / rudisha demo zote ${Object.keys(INDUSTRIES).length}</button></div>` : ""}
  </details>`;
}
async function demoMake(ind) {
  K.demoBusy = ind; render();
  try { await demoCreate(ind, !OWNER()); toast("✅ Demo ya " + INDUSTRIES[ind].name + " iko tayari"); } catch (e) { toast("Haikuwezekana: " + (e.message || "")); }
  K.demoBusy = ""; render();
}
async function demoAll() { for (const k of Object.keys(INDUSTRIES)) await demoMake(k); }

/* ---------- render ---------- */
function render() {
  const app = $("#app");
  if (!K.user) { app.innerHTML = vLogin(); return; }
  if (!IS_ADMIN) { app.innerHTML = `<div class="center"><div class="card panel"><h3>Ukurasa huu ni wa msimamizi tu</h3><button onclick="auth.signOut()">Toka</button></div></div>`; return; }
  const a = document.activeElement, fid = a && a.id, sel = a && "selectionStart" in a ? [a.selectionStart, a.selectionEnd] : null;
  app.innerHTML = `
    <div class="row" style="justify-content:space-between"><div><div class="note">E.E.MSANGO${IS_STAFF ? " · 🧑‍💼 Mfanyakazi: " + esc(K.user.email) : ""}</div><h2>🏭 Kiwanda cha mifumo</h2></div>
      ${K.showNew ? "" : `<button class="pri" onclick="openNew()">＋ Mfumo mpya</button>`}</div>
    ${K.loaded && !K.denied ? vLeo() : ""}
    ${vStats()}
    ${K.showNew ? vNew() : ""}
    ${vCreated()}
    ${vList()}
    ${vDemo()}
    ${vErrors()}
    ${vSettings()}`;
  if (fid) { const el = document.getElementById(fid); if (el) { el.focus(); if (sel && el.setSelectionRange) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}
function openNew() { K.showNew = true; K.form = K.form || blankForm(); K.msg = ""; render(); setTimeout(() => { const el = $("#nf-name"); el && el.focus(); }, 0); }

/* Kutoka Ofisi: kiwanda.html?mteja=<id> → jaza fomu kwa taarifa za mteja */
async function prefillFromClient(id) {
  try {
    const d = await db.collection("clients").doc(id).get(); if (!d.exists) return;
    const c = d.data(), n = c.needs || {}, f = blankForm();
    const edn = c.edition || "duka";
    Object.assign(f, { clientId: id, name: c.name || "", code: dukaSlug(c.name || ""), owner: c.owner || "", phone: c.phone || "", location: c.location || "", edition: edn,
      features: presetFeatures(edn), users: EDITIONS[edn].users, monthly: EDITIONS[edn].price, notes: n.special || c.notes || "" });
    // mahitaji ya Ofisi → vipengele
    const map = { credit: "owed", pos: "pos", whatsapp: "whatsapp", expenses: "matumizi", closeDay: "funga", wholesale: "jumla", transfer: "godown", profit: "ripoti" };
    Object.entries(map).forEach(([nk, fk]) => { if (n[nk]) f.features[fk] = true; });
    if ((+n.stores || 1) > 1) f.features.godown = true;
    if (f.features.jumla || f.features.whatsapp || f.features.matumizi || f.features.funga) f.features.pos = true;
    if (+n.sellers) f.users = Math.max(f.users, +n.sellers);
    K.form = f; K.showNew = true; render();
  } catch (e) {}
}

function prefillFromKatalogi() {
  const q = new URLSearchParams(location.search); if (!q.get("biashara") && !q.get("mandhari")) return;
  const f = blankForm();
  f.industry = INDUSTRIES[q.get("biashara")] ? q.get("biashara") : "spea";
  f.theme = THEMES[q.get("mandhari")] ? q.get("mandhari") : "asili";
  if (q.get("jina") && q.get("jina") !== "Duka Lako") { f.name = q.get("jina"); f.code = dukaSlug(f.name); }
  const fs = (q.get("f") || "").split(",").filter(Boolean);
  if (fs.length) { FEATURES.forEach(([k]) => (f.features[k] = fs.includes(k))); }
  f.edition = f.features.ripoti ? "pro" : (f.features.jumla || f.features.godown) ? "stoki" : f.features.pos ? "duka" : "mali";
  f.users = EDITIONS[f.edition].users;
  f.addons = (q.get("z") || "").split(",").filter((k) => ADDONS.some((a) => a[0] === k));
  f.monthly = EDITIONS[f.edition].price + ADDONS.filter((a) => f.addons.includes(a[0])).reduce((s, a) => s + a[3], 0);
  if (f.addons.length) f.notes = "Kutoka Katalogi — ziada: " + ADDONS.filter((a) => f.addons.includes(a[0])).map((a) => a[1]).join("; ");
  K.form = f; K.showNew = true;
}
auth.onAuthStateChanged(async (u) => {
  K.user = u;
  if (u) { await resolveShop(u); $("#who").textContent = u.email; if (IS_STAFF) document.querySelectorAll('nav.top a[href="ofisi.html"]').forEach((a) => (a.hidden = true)); if (IS_ADMIN) { listen(); prefillFromKatalogi(); const m = location.search.match(/[?&]mteja=([^&]+)/); if (m) prefillFromClient(decodeURIComponent(m[1])); } }
  else $("#who").textContent = "";
  render();
  if (K.open) setTimeout(() => { const el = document.getElementById("sys-" + K.open); el && el.scrollIntoView({ block: "start" }); }, 400);
});
</script>
