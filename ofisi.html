<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: mobile-first work tool — sticky header, one column of panels, bottom tab bar; wide screens get a two-column dashboard. */
:root{
  --bg:#F2F3EF; --surface:#FFFFFF; --sunk:#E9EBE6; --ink:#17201E; --muted:#5B6863; --line:#D7DCD6;
  --accent:#0D6A5B; --accent-ink:#FFFFFF; --accent-soft:#DDEEE9;
  --good:#1D7A3B; --warn:#A86400; --bad:#B3261E; --info:#2556A3;
  --good-soft:#E1F1E5; --warn-soft:#FBEFD9; --bad-soft:#F8E1DF; --info-soft:#E1EAF7;
  --f-display:"Archivo","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#161F1C; --sunk:#1D2825; --ink:#E4EBE8; --muted:#95A49E; --line:#2B3733;
  --accent:#43B9A2; --accent-ink:#06201B; --accent-soft:#163A33;
  --good:#5DC985; --warn:#E3A43C; --bad:#F2786D; --info:#80A9F1;
  --good-soft:#173322; --warn-soft:#3A2B10; --bad-soft:#3D1A17; --info-soft:#18284A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#161F1C; --sunk:#1D2825; --ink:#E4EBE8; --muted:#95A49E; --line:#2B3733;
  --accent:#43B9A2; --accent-ink:#06201B; --accent-soft:#163A33;
  --good:#5DC985; --warn:#E3A43C; --bad:#F2786D; --info:#80A9F1;
  --good-soft:#173322; --warn-soft:#3A2B10; --bad-soft:#3D1A17; --info-soft:#18284A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{font-family:var(--f-display);font-stretch:80%;font-weight:800;font-size:20px;letter-spacing:.01em;text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-stretch:100%;font-weight:500;font-size:11px;letter-spacing:.08em;color:var(--muted)}
.mode{margin-left:auto;font-size:12px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.mode.on{color:var(--good);border-color:var(--good)}
h1,h2,h3{font-family:var(--f-display);font-stretch:85%;text-wrap:balance;margin:0}
h2{font-size:22px;font-weight:800}
h3{font-size:16px;font-weight:700}
.eyebrow{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
section.view{display:grid;gap:16px;padding-top:16px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px;display:grid;gap:12px;min-width:0}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;gap:16px;grid-template-columns:1fr}
@media (min-width:820px){.grid2{grid-template-columns:1.2fr 1fr}}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:10px;overflow:hidden}
@media (min-width:700px){.kpis{grid-template-columns:repeat(3,minmax(0,1fr))}}
.kpi{background:var(--surface);padding:12px 14px;display:grid;gap:2px;min-width:0}
.kpi b{font-family:var(--f-mono);font-size:22px;font-weight:500;font-variant-numeric:tabular-nums}
.kpi .t{font-size:12px;color:var(--muted)}
.kpi .s{font-size:12px}
.ok{color:var(--good)} .wn{color:var(--warn)} .bd{color:var(--bad)}
.mrr{display:grid;gap:8px}
.mrr .big{font-family:var(--f-mono);font-size:32px;font-variant-numeric:tabular-nums}
.bar{position:relative;height:12px;background:var(--sunk);border-radius:6px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:var(--accent);border-radius:6px}
.bar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--ink);opacity:.5}
.scale{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.pipe{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.pipe button{all:unset;cursor:pointer;display:grid;gap:2px;padding:10px 8px;border-radius:8px;background:var(--sunk);text-align:center}
.pipe button:focus-visible{outline:2px solid var(--accent)}
.pipe b{font-family:var(--f-mono);font-size:20px;font-weight:500}
.pipe span{font-size:11px;color:var(--muted)}
.tasks{display:grid;gap:0;margin:0;padding:0;list-style:none}
.tasks li{display:grid;grid-template-columns:4px 1fr auto;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.tasks li:first-child{border-top:0}
.tasks li .sv{align-self:stretch;border-radius:2px}
.sv.bad{background:var(--bad)} .sv.warn{background:var(--warn)} .sv.info{background:var(--info)} .sv.good{background:var(--good)}
.tasks .tt{min-width:0}
.tasks .tt div{font-size:13px;color:var(--muted)}
.empty{padding:18px;border:1px dashed var(--line);border-radius:10px;color:var(--muted);text-align:center;display:grid;gap:10px;justify-items:center}
button,.btn{font:inherit;font-weight:600;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;cursor:pointer}
button:hover{border-color:var(--muted)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button.ghost{border-color:transparent;background:transparent;color:var(--accent);padding-inline:6px}
button.danger{color:var(--bad);border-color:var(--bad-soft)}
button.sm{font-size:13px;padding:5px 10px}
.pill{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:999px;white-space:nowrap}
.st-lead{background:var(--sunk);color:var(--muted)} .st-demo{background:var(--info-soft);color:var(--info)}
.st-trial{background:var(--warn-soft);color:var(--warn)} .st-paid{background:var(--good-soft);color:var(--good)} .st-lost{background:var(--bad-soft);color:var(--bad)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{font-size:13px;padding:5px 12px;border-radius:999px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
input,select,textarea{font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
textarea{min-height:70px;resize:vertical}
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);min-width:0}
.form{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr))}
.checks{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.ck{display:flex;gap:10px;align-items:flex-start;padding:8px 10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:14px}
.ck input{width:18px;height:18px;margin:2px 0 0;flex:none;accent-color:var(--accent)}
.list{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.client{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:4px 12px;padding:12px 14px;border-top:1px solid var(--line)}
.client:first-child{border-top:0}
.client:hover{background:var(--sunk)}
.client:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.client .n{font-weight:600;min-width:0;overflow-wrap:anywhere}
.client .m{font-size:13px;color:var(--muted);min-width:0}
.client .r{text-align:right;display:grid;gap:4px;justify-items:end}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
nav.tabs button{all:unset;cursor:pointer;text-align:center;padding:10px 4px 12px;font-size:12px;font-weight:600;color:var(--muted);display:grid;gap:3px;justify-items:center}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--accent)}
nav.tabs button:focus-visible{outline:2px solid var(--accent);outline-offset:-4px}
/* detail sheet */
.sheet{position:fixed;inset:0;z-index:20;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet .head{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line)}
.sheet .head .in{max-width:1040px;margin:0 auto;padding:10px 16px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sheet .head h2{flex:1;min-width:0;overflow-wrap:anywhere}
.subtabs{max-width:1040px;margin:0 auto;padding:0 16px 8px;display:flex;gap:4px;overflow-x:auto}
.subtabs button{all:unset;cursor:pointer;padding:8px 12px;font-size:14px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.subtabs button[aria-current="true"]{color:var(--ink);border-color:var(--accent)}
.subtabs button:focus-visible{outline:2px solid var(--accent)}
.stagebar{display:flex;gap:6px;flex-wrap:wrap}
.stagebar button{font-size:13px;padding:6px 10px}
.stagebar button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.eds{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.ed{all:unset;cursor:pointer;display:grid;gap:6px;align-content:start;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.ed:focus-visible{outline:2px solid var(--accent)}
.ed[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);background:var(--accent-soft)}
.ed .p{font-family:var(--f-mono);font-size:18px}
.ed ul{margin:0;padding-left:18px;font-size:13px;color:var(--muted)}
.ed .tag{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.06em;text-transform:uppercase}
.reco{border-left:4px solid var(--accent);background:var(--accent-soft);padding:10px 12px;border-radius:0 8px 8px 0;font-size:14px}
.reco ul{margin:4px 0 0;padding-left:18px}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:6px 8px;border-bottom:1px solid var(--line)}
table.t td{padding:8px;border-bottom:1px solid var(--line);vertical-align:top}
table.t td.r,table.t th.r{text-align:right}
.scroll{overflow-x:auto}
.doc{white-space:pre-wrap;font-family:var(--f-body);font-size:14px;background:var(--sunk);border-radius:8px;padding:14px;max-height:360px;overflow:auto;margin:0}
.steps{list-style:none;margin:0;padding:0;display:grid;gap:6px}
.steps li label{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--surface)}
.steps li input{width:18px;height:18px;margin:0;accent-color:var(--accent)}
.steps li.done label{background:var(--good-soft);border-color:transparent}
.steps .d{font-size:12px;color:var(--muted)}
.prog{font-family:var(--f-mono);font-size:13px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:40;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;font-size:14px;max-width:calc(100% - 32px)}
.sum{display:flex;gap:16px;flex-wrap:wrap;font-size:14px}
.sum div{display:grid}
.sum b{font-family:var(--f-mono);font-size:18px;font-weight:500}
.note{font-size:12px;color:var(--muted)}
@media (prefers-reduced-motion:no-preference){.bar i{transition:width .5s ease}}
</style>
<style>
.navl{color:var(--muted);text-decoration:none;font-weight:600;padding:6px 10px;border-radius:8px;font-size:14px}
.navl.on{background:var(--ink);color:var(--bg)}
.sysbox{display:grid;gap:8px;background:var(--sunk);border-radius:8px;padding:12px;font-size:14px}
.btnl{font:inherit;font-weight:600;font-size:14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:8px 14px;text-decoration:none;display:inline-flex;gap:6px;align-items:center}
.btnl.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.p-trial{background:var(--info-soft);color:var(--info)} .p-paid{background:var(--good-soft);color:var(--good)}
.p-soon{background:var(--warn-soft);color:var(--warn)} .p-exp,.p-off{background:var(--bad-soft);color:var(--bad)}
.login{min-height:70vh;display:grid;place-items:center}
</style>
</head>

  <div class="brand" id="brandName">E.E.Msango<small>Ofisi ya mifumo ya maduka</small></div>
  <a class="navl on" href="ofisi.html">📋 Ofisi</a><a class="navl" href="kiwanda.html">🏭 Kiwanda</a>
  <span class="mode" id="mode">Inaunganisha…</span>
</div></header>

<main class="wrap" id="app"></main>

<nav class="tabs" aria-label="Sehemu"><div class="in">
  <button data-tab="leo"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Leo</button>
  <button data-tab="wateja"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h10"/></svg>Wateja</button>
  <button data-tab="malipo"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="12" rx="2"/><path d="M3 10h18"/></svg>Malipo</button>
  <button data-tab="mipangilio"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M5 19l2-2M17 7l2-2"/></svg>Mipangilio</button>
</div></nav>

<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden role="status"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="duka.js?v=5"></script>
<script>
/* ---------- Blueprint data (from E.E.Msango Company Blueprint) ---------- */
const ED = {
  mali:{name:"Mali Yangu",price:15000,users:"1",feat:["Madeni (wadai na wadaiwa)","Stock ya bidhaa","Ripoti za msingi"]},
  duka:{name:"DukaSmart",price:30000,users:"3",star:true,feat:["Kila kitu cha Mali Yangu","POS ya mauzo","Risiti kwa WhatsApp","Matumizi (expenses)","Kufunga siku","Watumiaji hadi 3"]},
  stoki:{name:"StokiPesa",price:45000,users:"zaidi",feat:["Kila kitu cha DukaSmart","Bei za jumla","Stoo zaidi ya moja","Kuhamisha stock"]},
  pro:{name:"Hesabu Pro",price:60000,users:"Bila kikomo",feat:["Kila kitu cha StokiPesa","Matawi (branches)","Ripoti kamili za faida","Watumiaji bila kikomo"]}
};
const STAGES = [["lead","Mlengwa"],["demo","Demo"],["trial","Majaribio"],["paid","Analipa"],["lost","Ameacha"]];
const STAGE_NAME = Object.fromEntries(STAGES);
const SOP = [
  ["contract","Mkataba umesainiwa"],
  ["setupPaid","Ada ya setup imelipwa"],
  ["productList","Orodha ya bidhaa imepokelewa"],
  ["entered","Bidhaa, bei na stock zimeingizwa"],
  ["accounts","Akaunti na PIN za watumiaji zimeundwa"],
  ["trainOwner","Mafunzo ya mwenye duka (dk 30)"],
  ["trainSellers","Mafunzo ya wauzaji (dk 15 kila mmoja)"],
  ["call2","Simu ya ufuatiliaji — siku ya 2"],
  ["visit7","Ziara ya ufuatiliaji — siku ya 7"]
];
const DEF = {company:"E.E.MSANGO COMPANY LIMITED",tin:"118-065-771",phone:"",owner:"Eric Msango",helpers:[],trialDays:14,targetLow:1000000,targetHigh:2000000,commNew:10000,commPct:10,graceDays:3};

/* ---------- utilities ---------- */
const $ = s=>document.querySelector(s);
const esc = s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tzs = n=>"TZS "+Math.round(+n||0).toLocaleString("en-US");
const k = n=>{n=+n||0; return n>=1e6?(n/1e6).toFixed(n%1e6?2:0)+"M":n>=1e3?Math.round(n/1e3)+"k":String(n)};
const today = ()=>{const d=new Date(); return d.toISOString().slice(0,10)};
const ymd = d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const todayL = ()=>ymd(new Date());
const monthOf = s=>String(s||"").slice(0,7);
const curMonth = ()=>todayL().slice(0,7);
const addDays = (s,n)=>{const d=new Date(s+"T00:00:00"); d.setDate(d.getDate()+n); return ymd(d)};
const daysBetween = (a,b)=>Math.round((new Date(b+"T00:00:00")-new Date(a+"T00:00:00"))/864e5);
const fmtD = s=>{ if(!s) return "—"; const d=new Date(s+"T00:00:00"); return d.toLocaleDateString("sw-TZ",{day:"numeric",month:"short",year:"numeric"}) };
const fmtM = m=>{ const d=new Date(m+"-01T00:00:00"); return d.toLocaleDateString("sw-TZ",{month:"long",year:"numeric"}) };
const uid = ()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function weekStart(){const d=new Date(); const w=(d.getDay()+6)%7; d.setDate(d.getDate()-w); return ymd(d)}
function toast(msg){const t=$("#toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2600)}
function lsGet(k,d){try{const v=localStorage.getItem(k); return v==null?d:JSON.parse(v)}catch{return d}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}

/* ---------- store: shared db when available, otherwise this device ---------- */
const S = {clients:{}, config:{...DEF}};
firebase.initializeApp(firebaseConfig);
let db=firebase.firestore(), mode="db", readOnly=false;
const auth=firebase.auth();
let FB_USER=null, LOADED=false, SHOPS={}, LOGIN={email:"",pw:"",msg:""};
function saveLocal(){}
const clean=o=>JSON.parse(JSON.stringify(o));
const fpath=p=>p==="config/main"?"settings/crm":p;
/* downloads: faili linapakuliwa moja kwa moja kwenye kifaa */
const downloads={save:async({filename,data})=>{const b=new Blob([data],{type:filename.endsWith(".csv")?"text/csv":"text/html"});const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);return{status:"saved"}}};
const chains={};
function put(path,data){
  if(mode!=="db"){ saveLocal(); return }
  chains[path]=(chains[path]||Promise.resolve()).then(()=>db.doc(fpath(path)).set(clean(data))).catch(e=>{
    if(e&&e.code==="permission-denied"){ toast("Firebase imekataa — weka rules mpya (Kiwanda → Mipangilio).") }
    else toast("Haikuhifadhika. Angalia mtandao kisha jaribu tena.");
  });
}
function del(path){ db.doc(fpath(path)).delete().catch(()=>toast("Haikufutika. Jaribu tena.")) }
function saveConfig(){ put("config/main",S.config); render() }
function upd(id,fn){ const c=structuredClone(S.clients[id]); delete c._confirmDel; fn(c); c.updatedAt=Date.now(); S.clients[id]=c; put("clients/"+id,c); render() }

/* ---------- business logic from the Blueprint ---------- */
function recommend(n){
  n=n||{}; const why=[]; let e="mali";
  why.push("Anahitaji kufuatilia madeni na stock — msingi wa Mali Yangu.");
  const sellers=+n.sellers||1, stores=+n.stores||1, branches=+n.branches||1;
  if(n.pos||n.whatsapp||n.expenses||n.closeDay||sellers>1){e="duka";
    const r=[]; if(n.pos) r.push("POS ya mauzo"); if(n.whatsapp) r.push("risiti za WhatsApp"); if(n.expenses) r.push("matumizi"); if(n.closeDay) r.push("kufunga siku"); if(sellers>1) r.push(sellers+" wauzaji");
    why.push("Anataka "+r.join(", ")+" → DukaSmart.")}
  if(n.wholesale||stores>1||n.transfer||sellers>3){e="stoki";
    const r=[]; if(n.wholesale) r.push("bei za jumla"); if(stores>1) r.push(stores+" stoo"); if(n.transfer) r.push("kuhamisha stock"); if(sellers>3) r.push("wauzaji zaidi ya 3 (DukaSmart ina 3)");
    why.push(r.join(", ")+" → StokiPesa.")}
  if(branches>1||n.profit){e="pro";
    const r=[]; if(branches>1) r.push(branches+" matawi"); if(n.profit) r.push("ripoti kamili za faida");
    why.push(r.join(", ")+" → Hesabu Pro.")}
  return {e,why};
}
function suggestSetup(n){ n=n||{}; const p=+n.products||0; let f=30000;
  if(p>300) f+=10000; if(p>1000||(+n.branches||1)>1||(+n.stores||1)>1) f+=10000; return Math.min(f,50000) }
function monthlyOf(c){ const sh=c.shopCode&&SHOPS[c.shopCode]; if(sh&&sh.monthly) return sh.monthly; if(!c.edition) return 0; const base=ED[c.edition].price;
  const add=(c.addons||[]).filter(a=>a.kind==="month").reduce((s,a)=>s+(+a.price||0),0);
  return Math.max(0,base+add-(+c.discount||0)) }
function oneOffOf(c){ return (+c.setupFee||0)+(c.addons||[]).filter(a=>a.kind!=="month").reduce((s,a)=>s+(+a.price||0),0) }
function goLive(c){ const o=c.onboard||{}; return o.trainOwner?.d||o.accounts?.d||null }
function sopDone(c){ const o=c.onboard||{}; return SOP.filter(([k])=>o[k]?.done).length }
function dueDay(c){ return +c.dueDay || (c.paidAt?+c.paidAt.slice(8,10):1) }
function paidFor(c,m){ return (c.payments||[]).filter(p=>p.month===m).reduce((s,p)=>s+(+p.amount||0),0) }
function payStatus(c,m){
  const exp=monthlyOf(c), got=paidFor(c,m);
  if(got>=exp && exp>0) return "paid";
  if(c.paidAt && monthOf(c.paidAt)>m) return "na";
  const cm=curMonth(); if(m<cm) return got>0?"part":"late";
  if(m>cm) return "future";
  const d=+todayL().slice(8,10);
  if(d>dueDay(c)+(+S.config.graceDays||0)) return got>0?"part":"late";
  return got>0?"part":"due";
}
function clientsArr(){ return Object.values(S.clients).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0)) }
function people(){ return [S.config.owner||"Eric", ...(S.config.helpers||[])] }

function kpis(){
  const all=clientsArr(), ws=weekStart(), cm=curMonth();
  const inWeek=s=>s&&s>=ws; const inMonth=s=>s&&monthOf(s)===cm;
  const paying=all.filter(c=>c.stage==="paid");
  const mrr=paying.reduce((s,c)=>s+monthlyOf(c),0);
  const reachedTrial=all.filter(c=>c.trialAt);
  const conv=reachedTrial.filter(c=>c.paidAt).length;
  const closedTrials=reachedTrial.filter(c=>c.paidAt||c.stage==="lost").length;
  const churned=all.filter(c=>c.paidAt&&c.stage==="lost"&&inMonth(c.lostAt)).length;
  const base=paying.length+churned;
  const hrs=all.map(c=>+c.setupHours).filter(x=>x>0);
  const active=paying.filter(c=>c.activeDaily).length;
  return {
    demosW:all.filter(c=>inWeek(c.demoAt)).length,
    trialsW:all.filter(c=>inWeek(c.trialAt)).length,
    paidW:all.filter(c=>inWeek(c.paidAt)).length,
    conv: closedTrials? Math.round(conv/closedTrials*100):null, convN:conv, convD:closedTrials,
    paying:paying.length, mrr,
    churn: base? Math.round(churned/base*100):0, churned,
    setupAvg: hrs.length? (hrs.reduce((a,b)=>a+b,0)/hrs.length):null,
    activePct: paying.length? Math.round(active/paying.length*100):null
  };
}
function tasks(){
  const out=[], t=todayL(), cm=curMonth(), td=+S.config.trialDays||14;
  for(const c of clientsArr()){
    const nm=c.name||"Duka bila jina";
    if(c.stage==="paid"){ const st=payStatus(c,cm);
      if(st==="late") out.push({sv:"bad",c,t:"Malipo yamechelewa — "+nm,d:tzs(monthlyOf(c)-paidFor(c,cm))+" ya "+fmtM(cm)+" (tarehe "+dueDay(c)+")"});
      else if(st==="due" && dueDay(c)-+t.slice(8,10)<=3) out.push({sv:"warn",c,t:"Malipo yanakaribia — "+nm,d:"Tarehe "+dueDay(c)+" · "+tzs(monthlyOf(c))});
    }
    if(c.stage==="trial"||c.stage==="paid"){
      const o=c.onboard||{}, gl=goLive(c);
      if(gl&&!o.call2?.done){ const due=addDays(gl,2); if(due<=t) out.push({sv:due<t?"bad":"warn",c,t:"Piga simu ya siku ya 2 — "+nm,d:"Ilitakiwa "+fmtD(due)+(c.phone?" · "+c.phone:"")}) }
      if(gl&&!o.visit7?.done){ const due=addDays(gl,7); if(due<=addDays(t,1)) out.push({sv:due<t?"bad":"warn",c,t:"Tembelea duka (siku ya 7) — "+nm,d:"Ilitakiwa "+fmtD(due)+(c.location?" · "+c.location:"")}) }
      const done=sopDone(c); if(done<7 && c.trialAt) out.push({sv:"info",c,t:"Maliza setup — "+nm,d:done+"/"+SOP.length+" hatua za SOP zimekamilika"});
    }
    if(c.stage==="trial"&&c.trialAt){ const end=addDays(c.trialAt,td), left=daysBetween(t,end);
      if(left<=3) out.push({sv:left<0?"bad":"warn",c,t:(left<0?"Majaribio yameisha — ":"Majaribio yanaisha — ")+nm,d:(left<0?"Siku "+(-left)+" zilizopita":"Siku "+left+" zimebaki")+" · funga mauzo au uliza kinachozuia"}) }
    if(c.stage==="lead"){ const age=daysBetween(c.createdAt||t,t);
      if(age>=3) out.push({sv:"info",c,t:"Panga demo — "+nm,d:"Mlengwa kwa siku "+age})}
    if(c.stage==="demo"&&c.demoAt&&daysBetween(c.demoAt,t)>=2) out.push({sv:"info",c,t:"Fuatilia baada ya demo — "+nm,d:"Demo ilikuwa "+fmtD(c.demoAt)+" · mpe majaribio"});
  }
  const rank={bad:0,warn:1,info:2,good:3}; return out.sort((a,b)=>rank[a.sv]-rank[b.sv]);
}

  if(dl==null||dl<=0) return ["p-exp","Muda umeisha"];
  if(s.trialEnds&&s.paidUntil<=s.trialEnds) return ["p-trial","Majaribio · siku "+dl];
  if(dl<=5) return ["p-soon","Inaisha · siku "+dl];
  return ["p-paid","Imelipiwa · siku "+dl];

async function payExtend(c,amt){

  const s=c.shopCode&&SHOPS[c.shopCode]; if(!s) return;
  const monthly=s.monthly||(EDITIONS[s.edition]||EDITIONS.duka).price||monthlyOf(c)||1;
  const months=Math.max(1,Math.floor(amt/monthly+0.0001));
  try{ const until=await adminExtend(s.code,30*months); toast("✅ Malipo yamehifadhiwa · mfumo umewashwa hadi "+fmtDate(until)) }

function stamp(c,s){ const t=todayL(); c.stage=s;
  if(s==="demo"&&!c.demoAt) c.demoAt=t;
  if(s==="trial"){ c.demoAt=c.demoAt||t; c.trialAt=c.trialAt||t }
  if(s==="paid"){ c.demoAt=c.demoAt||t; c.trialAt=c.trialAt||t; c.paidAt=c.paidAt||t; c.lostAt=null }
  if(s==="lost") c.lostAt=t;
}
function guard(){ if(readOnly){ toast("Unaangalia tu — huwezi kubadilisha."); return true } return false }
document.addEventListener("click",async ev=>{
  const b=ev.target.closest("button"); if(!b) return;
  if(b.dataset.tab){ tab=b.dataset.tab; lsSet("mo-tab",tab); openId=null; render(); window.scrollTo(0,0); return }
  if(b.dataset.open){ openId=b.dataset.open; sub="taarifa"; render(); $("#sheet").scrollTop=0; return }
  if(b.dataset.sub){ sub=b.dataset.sub; render(); return }
  const act=b.dataset.act; if(!act) return;
  const c=openId&&S.clients[openId];
  switch(act){
    case "new": if(guard()) return; tab="wateja"; adding=true; render(); setTimeout(()=>$("#a-name")?.focus(),0); break;
    case "cancelAdd": adding=false; render(); break;
    case "pipe": tab="wateja"; filter=b.dataset.s; render(); break;
    case "filter": filter=b.dataset.s; render(); break;
    case "close": openId=null; render(); break;
    case "stage": if(guard()) return; upd(openId,x=>stamp(x,b.dataset.s)); toast("Hatua: "+STAGE_NAME[b.dataset.s]); break;
    case "askDelete": S.clients[openId]={...c,_confirmDel:true}; render(); break;
    case "noDelete": { const x={...c}; delete x._confirmDel; S.clients[openId]=x; render(); break }
    case "delete": if(guard()) return; { const id=openId; delete S.clients[id]; openId=null; del("clients/"+id); render(); toast("Mteja amefutwa") } break;
    case "useReco": case "edition": if(guard()) return; upd(openId,x=>{x.edition=b.dataset.e; if(x.setupFee==null) x.setupFee=suggestSetup(x.needs)}); toast(ED[b.dataset.e].name+" imechaguliwa"); break;
    case "rmAddon": if(guard()) return; upd(openId,x=>x.addons.splice(+b.dataset.i,1)); break;
    case "rmPay": if(guard()) return; upd(openId,x=>x.payments=x.payments.filter(p=>p.id!==b.dataset.pid)); break;
    case "quickpay": if(guard()) return; { const id=b.dataset.id, cl=S.clients[id], amt=monthlyOf(cl)-paidFor(cl,payMonth);
      upd(id,x=>{x.payments=x.payments||[]; x.payments.push({id:uid(),month:payMonth,amount:amt,date:todayL(),method:"M-Pesa"})}); toast("Malipo ya "+tzs(amt)+" yamewekwa"); payExtend(S.clients[id],amt) } break;
    case "rmHelper": if(guard()) return; S.config.helpers=S.config.helpers.filter((_,i)=>i!==+b.dataset.i); saveConfig(); break;
    case "copy": { const el=$("#doc-"+b.dataset.w); try{ await navigator.clipboard.writeText(el.textContent); toast("Imenakiliwa — bandika kwenye WhatsApp") }catch{ const r=document.createRange(); r.selectNodeContents(el); const s=getSelection(); s.removeAllRanges(); s.addRange(r); toast("Maandishi yamechaguliwa — nakili kwa mkono") } } break;
    case "dlContract": if(!downloads) return; try{ await downloads.save({filename:"Mkataba-"+(c.name||"mteja").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"-")+".html",data:contractHTML(c)}); toast("Mkataba umepakuliwa — ufungue kisha uchapishe") }catch(e){ if(e?.code!=="declined") toast("Haikupakuliwa. Tumia Nakili badala yake.") } break;
    case "csv": { const rows=[["Duka","Mwenye","Simu","Eneo","Hatua","Edition","Ada/mwezi","Msaidizi","Demo","Majaribio","Alianza kulipa"]].concat(clientsArr().map(x=>[x.name,x.owner,x.phone,x.location,STAGE_NAME[x.stage],x.edition?ED[x.edition].name:"",monthlyOf(x),x.helper,x.demoAt,x.trialAt,x.paidAt]));
      const csv=rows.map(r=>r.map(v=>'"'+String(v??"").replace(/"/g,'""')+'"').join(",")).join("\n");
      if(!downloads){ toast("Kupakua hakupatikani hapa."); return }
      try{ await downloads.save({filename:"wateja-"+todayL()+".csv",data:"﻿"+csv}); toast("Orodha imepakuliwa") }catch(e){ if(e?.code!=="declined") toast("Haikupakuliwa.") } } break;
  }
});
document.addEventListener("submit",ev=>{
  ev.preventDefault(); const f=ev.target; if(guard()) return;
  if(f.id==="addForm"){ const name=$("#a-name").value.trim(); if(!name){ toast("Andika jina la duka"); return }
    const id=uid(), c={id,name,owner:$("#a-owner").value.trim(),phone:$("#a-phone").value.trim(),location:$("#a-loc").value.trim(),type:$("#a-type").value,helper:$("#a-helper").value,stage:"lead",createdAt:todayL(),needs:{},addons:[],payments:[],onboard:{},updatedAt:Date.now()};
    stamp(c,$("#a-stage").value); S.clients[id]=c; put("clients/"+id,c); adding=false; openId=id; sub="mahitaji"; render(); toast("Mteja ameongezwa — jaza mahitaji yake"); }
  if(f.id==="helperForm"){ const n=$("#h-name").value.trim(); if(!n) return; S.config.helpers=[...(S.config.helpers||[]),n]; saveConfig(); }
  if(f.id==="addonForm"){ const n=$("#ad-name").value.trim(), p=+$("#ad-price").value||0; if(!n){ toast("Andika jina la nyongeza"); return }
    upd(openId,x=>{x.addons=x.addons||[]; x.addons.push({name:n,price:p,kind:$("#ad-kind").value})}); }
  if(f.id==="payForm"){ const amt=+$("#p-amt").value; if(!(amt>0)){ toast("Weka kiasi sahihi"); return }
    upd(openId,x=>{x.payments=x.payments||[]; x.payments.push({id:uid(),month:$("#p-month").value,amount:amt,date:$("#p-date").value,method:$("#p-method").value})}); toast("Malipo yamehifadhiwa"); payExtend(S.clients[openId],amt); }
});
document.addEventListener("change",ev=>{
  const el=ev.target;
  if(el.id==="pm"){ payMonth=el.value||curMonth(); render(); return }
  if(el.id&&el.id.startsWith("c-")){ if(guard()) return; const key=el.id.slice(2); S.config[key]=el.type==="number"?+el.value:el.value; saveConfig(); toast("Imehifadhiwa"); return }
  if(!openId) return;
  if(el.dataset.f){ if(guard()) return; const v=el.type==="checkbox"?el.checked:el.type==="number"?(el.value===""?null:+el.value):el.value; upd(openId,x=>x[el.dataset.f]=v); return }
  if(el.dataset.n){ if(guard()) return; const v=el.type==="checkbox"?el.checked:el.type==="number"?(el.value===""?null:+el.value):el.value; upd(openId,x=>{x.needs=x.needs||{}; x.needs[el.dataset.n]=v}); return }
  if(el.dataset.sop){ if(guard()) return; const key=el.dataset.sop; upd(openId,x=>{x.onboard=x.onboard||{}; x.onboard[key]=el.checked?{done:true,d:todayL()}:{done:false}}); return }
});
document.addEventListener("input",ev=>{ if(ev.target.id==="q"){ query=ev.target.value; render() } });
document.addEventListener("keydown",ev=>{ if(ev.key==="Escape"&&openId){ openId=null; render() } });

/* ---------- Firebase: msimamizi tu ---------- */
function doLogin(){ auth.signInWithEmailAndPassword(LOGIN.email.trim(),LOGIN.pw).catch(e=>{ LOGIN.msg=/wrong|invalid|not-found/.test(e.code||"")?"Email au password si sahihi.":(e.message||"Imeshindikana"); render() }) }
let _started=false;
auth.onAuthStateChanged(async u=>{
  FB_USER=u; if(u) await resolveShop(u); render();
  if(!u||!IS_ADMIN||_started) return; _started=true;
  let got=0; const ready=()=>{ if(++got>=2){ LOADED=true; const h=location.hash.slice(1); if(h&&S.clients[h]&&!openId){ openId=h; sub="mfumo"; tab="wateja" } } render() };
  db.collection("clients").onSnapshot(s=>{ const m={}; s.docs.forEach(x=>{ const v=x.data(); if(v) m[x.id]={...v,id:x.id} }); S.clients=m; if(!LOADED) ready(); else render() },
    e=>{ toast(e&&e.code==="permission-denied"?"Firebase imekataa — weka rules mpya (Kiwanda → Mipangilio).":"Imeshindwa kusoma wateja."); LOADED=true; render() });
  db.collection("shops").onSnapshot(s=>{ const m={}; s.docs.forEach(x=>{ m[x.id]={code:x.id,...x.data()} }); SHOPS=m; if(!LOADED) ready(); else render() }, ()=>{ if(!LOADED) ready() });
  db.doc("settings/crm").onSnapshot(s=>{ S.config={...DEF,...(s.exists?s.data():{})}; render() }, ()=>{});
});
</script>
