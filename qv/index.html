<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>QuantVision Mobile</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0d1014">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one-thumb trading console — sticky account header, scrolling cards, fixed bottom tabs. Dark instrument panel, gold for XAU. */
:root{
  color-scheme:dark;
  --bg:#0b0e12; --sf:#12161c; --sf2:#181d25; --ln:#232a34; --fg:#e6e9ee; --mu:#8a94a3; --fa:#5a6472;
  --gold:#e9b949; --goldI:#17120a; --up:#25c08a; --dn:#ef5466; --upA:rgba(37,192,138,.13); --dnA:rgba(239,84,102,.13); --blue:#4f8fe8;
  --fd:'Chakra Petch','Segoe UI',system-ui,sans-serif; --fb:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',sans-serif; --fm:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--fb);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.num{font-family:var(--fm);font-variant-numeric:tabular-nums}
.mu{color:var(--mu)} .fa{color:var(--fa)} .up{color:var(--up)} .dn{color:var(--dn)} .gold{color:var(--gold)}
.xs{font-size:12px} .sm{font-size:13px}
.wrap{max-width:560px;margin:0 auto;padding:0 14px calc(92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(10px);padding:calc(10px + env(safe-area-inset-top,0px)) 14px 10px;border-bottom:1px solid var(--ln)}
header.top .in{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.logo{font-family:var(--fd);font-weight:700;font-size:17px;letter-spacing:.04em;display:flex;align-items:center;gap:8px}
.logo i{width:10px;height:10px;border-radius:2px;background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
.sp{flex:1}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;padding:3px 8px;border-radius:999px;background:var(--sf2);color:var(--mu);white-space:nowrap}
.pill.up{background:var(--upA);color:var(--up)} .pill.dn{background:var(--dnA);color:var(--dn)} .pill.gold{background:color-mix(in srgb,var(--gold) 16%,transparent);color:var(--gold)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.pill.live .dot{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:16px;padding:14px;display:grid;gap:10px;margin-top:12px}
.card h3{margin:0;font-family:var(--fd);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mu);display:flex;align-items:center;justify-content:space-between;gap:8px}
.hero{display:grid;gap:4px}
.hero .lbl{font-size:12px;color:var(--mu);letter-spacing:.06em;text-transform:uppercase}
.hero .big{font-family:var(--fd);font-size:34px;font-weight:700;line-height:1.05}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kv div{background:var(--sf2);border-radius:10px;padding:8px 10px;display:grid;gap:1px;min-width:0}
.kv span{font-size:11px;color:var(--mu);letter-spacing:.05em;text-transform:uppercase}
.kv b{font-family:var(--fm);font-size:14px;font-variant-numeric:tabular-nums;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.verdict{border-radius:12px;padding:12px;background:var(--sf2);display:grid;gap:6px}
.verdict.buy{background:var(--upA);outline:1px solid color-mix(in srgb,var(--up) 45%,transparent)}
.verdict.sell{background:var(--dnA);outline:1px solid color-mix(in srgb,var(--dn) 45%,transparent)}
.verdict .h{font-family:var(--fd);font-size:18px;font-weight:700;line-height:1.2}
.verdict .kv{gap:6px} .verdict .kv div{padding:6px 7px} .verdict .kv b{font-size:12.5px;white-space:normal;overflow:visible}
.ring{--p:0;width:58px;height:58px;border-radius:50%;background:conic-gradient(var(--c,var(--gold)) calc(var(--p)*1%),var(--ln) 0);display:grid;place-items:center;flex:none}
.ring b{width:46px;height:46px;border-radius:50%;background:var(--sf);display:grid;place-items:center;font-family:var(--fm);font-size:15px}
.ck{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.ck li{display:grid;grid-template-columns:18px 1fr auto;gap:6px;font-size:13.5px}
.ck .w{font-family:var(--fm);font-size:11px;color:var(--fa)}
.lst{display:grid}
.it{display:grid;grid-template-columns:auto 1fr auto;gap:4px 10px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.it:first-child{border-top:0}
.side{font-family:var(--fd);font-weight:700;font-size:12px;padding:4px 8px;border-radius:7px}
.side.BUY{background:var(--upA);color:var(--up)} .side.SELL{background:var(--dnA);color:var(--dn)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--ln);background:var(--sf2);border-radius:12px;padding:11px 14px;font-weight:600;cursor:pointer}
.btn.p{background:var(--gold);border-color:var(--gold);color:var(--goldI)}
.btn.d{color:var(--dn);border-color:color-mix(in srgb,var(--dn) 45%,transparent);background:var(--dnA)}
.btn.full{width:100%}
.btn:disabled{opacity:.5}
.btn:focus-visible,.tg:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input.f{width:100%;background:var(--sf2);border:1px solid var(--ln);border-radius:12px;padding:12px 13px;font-size:16px}
label.l{display:grid;gap:5px;font-size:12.5px;color:var(--mu)}
.tg{position:relative;width:52px;height:30px;border-radius:99px;background:var(--ln);border:0;cursor:pointer;flex:none;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s}
.tg.on{background:var(--up)} .tg.on::after{transform:translateX(22px)}
.tg.warn.on{background:var(--gold)}
.ctl{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--ln)}
.ctl:first-of-type{border-top:0}
.ctl .t{flex:1;display:grid}
.ctl .t b{font-size:15px} .ctl .t span{font-size:12.5px;color:var(--mu)}
.step{display:flex;align-items:center;gap:6px}
.step button{width:36px;height:36px;border-radius:10px;border:1px solid var(--ln);background:var(--sf2);font-size:18px;cursor:pointer}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,var(--sf) 96%,transparent);backdrop-filter:blur(10px);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
nav.tabs button{background:none;border:0;padding:9px 2px 10px;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:700;color:var(--fa);cursor:pointer}
nav.tabs button i{font-style:normal;font-size:19px;filter:grayscale(1);opacity:.75}
nav.tabs button.on{color:var(--gold)} nav.tabs button.on i{filter:none;opacity:1}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 18px}
.login .box{width:min(400px,100%);display:grid;gap:12px}
.login h1{font-family:var(--fd);font-size:30px;margin:0;line-height:1.1}
.err{color:var(--dn);font-size:13px}
.empty{padding:22px 10px;text-align:center;color:var(--mu)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;z-index:50;max-width:calc(100% - 32px)}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:end center;z-index:60;padding:16px}
.sheet{background:var(--sf);border:1px solid var(--ln);border-radius:18px;padding:18px;width:min(520px,100%);display:grid;gap:12px;margin-bottom:env(safe-area-inset-bottom,0px)}
code.k{display:block;font-family:var(--fm);font-size:15px;background:var(--sf2);border:1px dashed var(--gold);border-radius:10px;padding:12px;word-break:break-all;color:var(--gold)}
ol.steps{margin:0;padding-left:20px;display:grid;gap:6px;font-size:14px}
svg text{fill:var(--mu);font-family:var(--fm);font-size:10px}
.seg{display:flex;background:var(--sf2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:7px 4px;border-radius:8px;font-size:12.5px;font-weight:700;color:var(--mu);cursor:pointer}
.seg button.on{background:var(--sf);color:var(--fg)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><div class="login"><div class="box"><p class="mu">Inafungua…</p></div></div></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script>
"use strict";
firebase.initializeApp({ apiKey: "AIzaSyBvu8P09kqVPNeyDSHdSOM6niKW6EpjVXI", authDomain: "quantvision-eric-bot.firebaseapp.com", projectId: "quantvision-eric-bot", storageBucket: "quantvision-eric-bot.firebasestorage.app", messagingSenderId: "818022873017", appId: "1:818022873017:web:abc8424608e72710b7a868" });
const ADMIN = "ericemmanuelmsango2004@gmail.com";
const db = firebase.firestore(), auth = firebase.auth();
try { db.enablePersistence({ synchronizeTabs: true }).catch(() => {}); } catch (e) {}

const S = { user: null, ready: false, accts: [], acct: null, st: null, ctl: null, key: null, signals: [], trades: [], tab: "home", period: "7", login: { email: ADMIN, msg: "" }, unsub: [] };
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const dg = () => (S.st && S.st.digits) || 2;
const px = (v) => v == null || !isFinite(v) ? "—" : Number(v).toLocaleString("en-US", { minimumFractionDigits: dg(), maximumFractionDigits: dg() });
const money = (v, sign) => { if (v == null || !isFinite(v)) return "—"; const s = Math.abs(v).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 }); return (sign ? (v >= 0 ? "+" : "−") : v < 0 ? "−" : "") + s; };
const cur = () => (S.st && S.st.currency) || "";
const ago = (ms) => { const s = Math.max(0, (Date.now() - ms) / 1000); return s < 60 ? Math.round(s) + "s" : s < 3600 ? Math.round(s / 60) + " dk" : s < 86400 ? Math.round(s / 3600) + " saa" : Math.round(s / 86400) + " siku"; };
const hm = (ms) => new Date(ms).toLocaleTimeString("sw-TZ", { hour: "2-digit", minute: "2-digit" });
const dstr = (ms) => new Date(ms).toLocaleDateString("sw-TZ", { day: "numeric", month: "short" });
function toast(m) { let t = $("#toast"); if (!t) { t = document.createElement("div"); t.id = "toast"; t.className = "toast"; document.body.appendChild(t); } t.textContent = m; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); }

/* ---------------- auth ---------------- */
auth.onAuthStateChanged((u) => {
  S.user = u; S.ready = true;
  if (u && (u.email || "").toLowerCase() === ADMIN) loadAccounts(); else render();
});
function doLogin() {
  const e = $("#lg-e").value.trim(), p = $("#lg-p").value;
  if (!e || !p) { S.login.msg = "Andika email na password."; return render(); }
  S.login.msg = "Inaingia…"; render();
  auth.signInWithEmailAndPassword(e, p).then(() => { S.login.msg = ""; if (!auth.currentUser) location.reload(); })
    .catch((er) => { const c = er.code || ""; S.login.msg = /wrong|invalid|not-found|credential/.test(c) ? "Email au password si sahihi." : /network/.test(c) ? "Hakuna mtandao." : (er.message || c); render(); });
}
function forgot() { const e = ($("#lg-e") || {}).value || ADMIN; auth.sendPasswordResetEmail(e).then(() => toast("📧 Link ya kubadilisha password imetumwa")).catch(() => toast("Haikutumwa — angalia email")); }

/* ---------------- data ---------------- */
function loadAccounts() {
  S.unsub.forEach((u) => u()); S.unsub = [];
  S.unsub.push(db.collection("qv").onSnapshot((snap) => {
    S.accts = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    let pick = null; try { pick = localStorage.getItem("qv_acct"); } catch (e) {}
    if (!S.acct || !S.accts.find((a) => a.id === S.acct)) S.acct = (S.accts.find((a) => a.id === pick) || S.accts[0] || {}).id || null;
    if (S.acct && S._watching !== S.acct) watch(S.acct);
    S.loaded = true; render();
  }, (e) => { S.loadErr = e.code === "permission-denied" ? "Rules za Firebase bado hazijawekwa kwa QuantVision. Weka rules mpya (angalia maelekezo)." : e.message; S.loaded = true; render(); }));
}
function watch(id) {
  S._watching = id; (S.sub || []).forEach((u) => u()); S.sub = [];
  try { localStorage.setItem("qv_acct", id); } catch (e) {}
  const ref = db.collection("qv").doc(id);
  S.sub.push(ref.onSnapshot((d) => { S.st = d.exists ? d.data() : null; render(); }));
  S.sub.push(db.collection("qvctl").doc(id).onSnapshot((d) => { S.ctl = d.exists ? d.data() : null; render(); }, () => {}));
  S.sub.push(db.collection("qvkeys").doc(id).onSnapshot((d) => { S.key = d.exists ? d.data().key : null; render(); }, () => {}));
  S.sub.push(ref.collection("signals").orderBy("t", "desc").limit(60).onSnapshot((q) => { S.signals = q.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.t - a.t); render(); }, () => {}));
  S.sub.push(ref.collection("trades").orderBy("t", "desc").limit(500).onSnapshot((q) => { S.trades = q.docs.map((d) => ({ id: d.id, ...d.data() })).sort((a, b) => b.t - a.t); render(); }, () => {}));
}
const online = () => S.st && Date.now() - S.st.t < 90e3;
function setCtl(p) {
  if (!S.acct) return;
  S.ctl = { ...(S.ctl || {}), ...p }; render();
  return db.collection("qvctl").doc(S.acct).set({ ...p, at: Date.now() }, { merge: true }).then(() => toast("✅ Imetumwa — robot itapokea ndani ya sekunde ~10")).catch((e) => toast("Haikutumwa: " + (e.code || e.message)));
}

/* ---------------- connect account ---------------- */
function rndKey() { const a = new Uint8Array(18); crypto.getRandomValues(a); return Array.from(a, (b) => "abcdefghjkmnpqrstuvwxyz23456789"[b % 31]).join(""); }
async function addAccount() {
  const login = ($("#ac-login").value || "").replace(/\D/g, "");
  if (login.length < 4) return toast("Andika namba ya akaunti ya MT5 (login)");
  const key = rndKey();
  try {
    await db.collection("qvkeys").doc(login).set({ key, at: Date.now() });
    await db.collection("qvctl").doc(login).set({ auto: false, paused: false, risk: 1, at: Date.now() }, { merge: true });
    S.newKey = { login, key }; S.acct = login; watch(login); sheet(null); render();
  } catch (e) { toast("Haikuhifadhika: " + (e.code === "permission-denied" ? "weka rules mpya za Firebase kwanza" : e.message)); }
}
function sheet(html) {
  let o = $("#sheet"); if (!html) { if (o) o.remove(); return; }
  if (!o) { o = document.createElement("div"); o.id = "sheet"; o.className = "ov"; o.onclick = (e) => { if (e.target === o) sheet(null); }; document.body.appendChild(o); }
  o.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  const f = o.querySelector("input"); f && setTimeout(() => f.focus(), 30);
}
function connectSheet() {
  sheet(`<b style="font-size:17px">Unganisha akaunti ya MT5</b>
    <label class="l">Namba ya akaunti (login) ya MT5<input id="ac-login" class="f num" inputmode="numeric" placeholder="mf. 51234567"></label>
    <p class="mu sm" style="margin:0">Utapewa <b>sync key</b> ya kuweka kwenye EA. Kila akaunti ina key yake.</p>
    <div class="row"><button class="btn" style="flex:1" onclick="sheet(null)">Ghairi</button><button class="btn p" style="flex:1" onclick="addAccount()">Tengeneza key</button></div>`);
}
function closeAllSheet() {
  const n = (S.st && S.st.positions || []).length;
  sheet(`<b style="font-size:17px">Funga trade zote?</b><p class="mu" style="margin:0">Robot itafunga trade ${n} zilizo wazi za ${esc(S.st ? S.st.symbol : "")} kwa bei ya soko. Haiwezi kurudishwa.</p>
    <div class="row"><button class="btn" style="flex:1" onclick="sheet(null)">Hapana</button><button class="btn d" style="flex:1" onclick="sheet(null);setCtl({closeAll:Date.now()})">Ndiyo, funga zote</button></div>`);
}

/* ---------------- views ---------------- */
function vLogin() {
  const notAdmin = S.user && (S.user.email || "").toLowerCase() !== ADMIN;
  return `<div class="login"><div class="box">
    <div class="logo" style="font-size:22px"><i></i>QuantVision</div>
    <h1>Robot yako, popote ulipo.</h1>
    <p class="mu" style="margin:0">Ingia kuona trade, signal na faida za robot yako ya MT5 live.</p>
    ${notAdmin ? `<p class="err">${esc(S.user.email)} haina ruhusa ya kuingia hapa.</p><button class="btn" onclick="auth.signOut()">Toka</button>` : `
    <label class="l">Email<input id="lg-e" class="f" type="email" autocomplete="username" value="${esc(S.login.email)}"></label>
    <label class="l">Password<input id="lg-p" class="f" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')doLogin()"></label>
    ${S.login.msg ? `<div class="${S.login.msg.startsWith("Inaingia") ? "mu" : "err"}">${esc(S.login.msg)}</div>` : ""}
    <button class="btn p full" onclick="doLogin()">Ingia</button>
    <button class="btn full" style="background:none;border:0;color:var(--mu)" onclick="forgot()">Umesahau password?</button>`}
  </div></div>`;
}
function header() {
  const st = S.st, on = online();
  return `<header class="top"><div class="in"><div class="logo"><i></i>QV</div>
    ${S.accts.length > 1 ? `<select class="pill" style="border:0" onchange="S.acct=this.value;watch(this.value)">${S.accts.map((a) => `<option value="${esc(a.id)}" ${a.id === S.acct ? "selected" : ""}>${esc(a.id)}</option>`).join("")}</select>` : `<span class="pill">${esc(S.acct || "—")}</span>`}
    ${st ? `<span class="pill ${st.demo ? "gold" : "dn"}">${st.demo ? "Demo" : "Real"}</span>` : ""}
    <span class="sp"></span>
    ${st ? `<span class="pill ${on ? "up live" : "dn"}"><span class="dot"></span>${on ? "Live" : "Offline " + ago(st.t)}</span>` : ""}</div></header>`;
}
function vHome() {
  const st = S.st;
  if (!st) return noData();
  const today = st.today || 0, fl = (st.positions || []).reduce((s, p) => s + (p.profit || 0), 0);
  const live = st.live, d = st.dir, score = Math.round(st.score || 0), need = st.minScore || 70;
  const mode = st.paused ? ["PAUSED", "gold"] : st.auto ? ["AUTO", "up"] : ["SIGNALS", ""];
  return `
  ${st.err ? `<div class="card" style="border-color:var(--dn)"><b class="dn">⚠️ Tatizo la sync</b><span class="sm">${esc(st.err)}</span></div>` : ""}
  ${!online() ? `<div class="card" style="border-color:var(--dn)"><b class="dn">Robot iko offline</b><span class="sm mu">Taarifa ya mwisho ilifika ${ago(st.t)} iliyopita (${hm(st.t)}). Hakikisha MT5 iko wazi, ina mtandao, na EA iko kwenye chati.</span></div>` : ""}
  <div class="card">
    <div class="row between"><div class="hero"><span class="lbl">Equity</span><span class="big num">${money(st.equity)}</span><span class="mu sm">${esc(cur())} · Balance ${money(st.balance)}</span></div>
      <div style="text-align:right;display:grid;gap:4px"><span class="lbl mu xs" style="letter-spacing:.06em;text-transform:uppercase">Leo</span><b class="num ${today >= 0 ? "up" : "dn"}" style="font-size:20px">${money(today, true)}</b><span class="num xs ${today >= 0 ? "up" : "dn"}">${(st.todayPct || 0) >= 0 ? "+" : ""}${(st.todayPct || 0).toFixed(2)}%</span></div></div>
    <div class="kv"><div><span>Floating</span><b class="${fl >= 0 ? "up" : "dn"}">${money(fl, true)}</b></div><div><span>Trade leo</span><b>${st.tradesToday || 0}/${st.maxTrades || 0}</b></div><div><span>Free margin</span><b>${money(st.freeMargin)}</b></div></div>
    <div class="row"><span class="pill ${mode[1]}">${mode[0]}</span><span class="pill">Risk ${(st.risk || 0).toFixed(2)}%</span>${st.dailyStop ? `<span class="pill dn">Imesimama leo: hasara ${st.maxDailyLoss}%</span>` : `<span class="pill">Kikomo ${st.maxDailyLoss || 0}%/siku</span>`}</div>
  </div>
  <div class="card">
    <h3>AI Analyst <span class="pill">${esc(st.symbol)} ${esc(st.tf)} · ${esc(st.htfName)} ${st.htf === 1 ? "▲" : st.htf === -1 ? "▼" : "◆"}</span></h3>
    <div class="row" style="flex-wrap:nowrap;align-items:flex-start">
      <div class="ring" style="--p:${score};--c:${score >= need ? "var(--up)" : score >= 50 ? "var(--gold)" : "var(--fa)"}"><b>${score}</b></div>
      <div class="verdict ${live ? (d === 1 ? "buy" : "sell") : ""}" style="flex:1;min-width:0">
        <div class="h">${live ? (d === 1 ? "▲ BUY setup" : "▼ SELL setup") : "Hakuna setup — subiri"}</div>
        ${live ? `<div class="kv"><div><span>Entry</span><b>${px(st.entry)}</b></div><div><span>SL</span><b class="dn">${px(st.sl)}</b></div><div><span>TP</span><b class="up">${px(st.tp)}</b></div></div><span class="xs mu">R:R 1:${(st.rr || 0).toFixed(1)}${st.kz ? " · " + esc(st.kz) : ""}</span>`
          : `<span class="sm mu">Alama ${score}/${need} upande wa ${d === 1 ? "BUY" : "SELL"}. Robot inasubiri vigezo vyote vikamilike.</span>`}
      </div></div>
    <ul class="ck">${(st.checklist || []).map((c) => `<li><span class="${c.veto ? "dn" : c.ok ? "up" : "fa"}">${c.veto ? "✕" : c.ok ? "✓" : "○"}</span><span class="${c.ok ? "" : "mu"}">${esc(c.label)}</span><span class="w">+${c.w}</span></li>`).join("")}</ul>
    <div class="kv"><div><span>Bid</span><b>${px(st.bid)}</b></div><div><span>Spread</span><b>${Math.round(st.spread || 0)}</b></div><div><span>Signal ya mwisho</span><b>${st.lastSignal ? ago(st.lastSignal) : "—"}</b></div></div>
  </div>
  <div class="card"><h3>Trade zilizo wazi <span class="pill">${(st.positions || []).length}</span></h3>
    ${(st.positions || []).length ? `<div class="lst">${st.positions.map((p) => `<div class="it"><span class="side ${p.side}">${p.side}</span>
      <div style="min-width:0"><b class="num">${p.vol} @ ${px(p.open)}</b><div class="xs mu num">SL ${px(p.sl)} · TP ${px(p.tp)}</div></div>
      <div style="text-align:right"><b class="num ${p.profit >= 0 ? "up" : "dn"}">${money(p.profit, true)}</b><div class="xs num ${p.r >= 0 ? "up" : "dn"}">${p.r >= 0 ? "+" : ""}${(p.r || 0).toFixed(2)}R</div></div></div>`).join("")}</div>
      <button class="btn d full" onclick="closeAllSheet()">Funga zote</button>` : `<div class="empty sm">Hakuna trade iliyo wazi.</div>`}</div>
  <div class="card"><h3>Zone zilizo karibu</h3>
    ${(st.zones || []).length ? `<div class="lst">${st.zones.map((z) => `<div class="it"><span class="pill ${/Demand|Bullish/.test(z.type) ? "up" : "dn"}">${/FVG/.test(z.type) ? "FVG" : "OB"}</span><span class="sm">${esc(z.type)}</span><b class="num sm">${px(z.bot)} – ${px(z.top)}</b></div>`).join("")}</div>` : `<div class="empty sm">—</div>`}
    ${st.dr && st.dr.ok ? `<div class="xs mu">Dealing range ${px(st.dr.lo)} – ${px(st.dr.hi)} · EQ ${px((st.dr.lo + st.dr.hi) / 2)}</div>` : ""}</div>
  <p class="xs fa" style="text-align:center;margin:14px 0 0">Imesasishwa ${hm(st.t)} · EA v${esc(st.ver)} · ${esc(st.server || "")}</p>`;
}
function noData() {
  if (!S.accts.length) return `<div class="card"><h3>Karibu</h3><p style="margin:0">Bado hujaunganisha akaunti ya MT5.</p><button class="btn p full" onclick="S.tab='acct';render()">＋ Unganisha akaunti</button></div>`;
  return `<div class="card"><h3>Inasubiri robot</h3><p class="mu" style="margin:0">Akaunti ${esc(S.acct)} imeunganishwa lakini robot bado haijatuma taarifa. Hakikisha umeweka sync key kwenye EA na kuruhusu WebRequest (angalia kichupo cha Akaunti).</p></div>`;
}
/* trades: merge partial closes into one row per position */
function positions() {
  const m = {};
  for (const t of S.trades) { const k = t.position || t.id; const p = (m[k] = m[k] || { position: k, side: t.side, profit: 0, r: 0, t: 0, parts: 0, reason: "", symbol: t.symbol }); p.profit += t.profit || 0; p.r += t.r || 0; p.parts++; if (t.t > p.t) { p.t = t.t; p.reason = t.reason; } }
  return Object.values(m).sort((a, b) => b.t - a.t);
}
function vTrades() {
  const from = S.period === "all" ? 0 : Date.now() - Number(S.period) * 864e5;
  const P = positions().filter((p) => p.t >= from), W = P.filter((p) => p.profit > 0), net = P.reduce((s, p) => s + p.profit, 0);
  const gw = W.reduce((s, p) => s + p.profit, 0), gl = -P.filter((p) => p.profit <= 0).reduce((s, p) => s + p.profit, 0);
  const sumR = P.reduce((s, p) => s + p.r, 0);
  const curve = [0]; [...P].reverse().forEach((p) => curve.push(curve[curve.length - 1] + p.profit));
  let peak = 0, dd = 0; curve.forEach((v) => { peak = Math.max(peak, v); dd = Math.max(dd, peak - v); });
  const days = {}; P.forEach((p) => { const k = dstr(p.t); (days[k] = days[k] || []).push(p); });
  return `<div class="card"><div class="seg">${[["1", "Leo"], ["7", "Wiki"], ["30", "Mwezi"], ["all", "Zote"]].map(([k, l]) => `<button class="${S.period === k ? "on" : ""}" onclick="S.period='${k}';render()">${l}</button>`).join("")}</div>
    <div class="hero"><span class="lbl">Faida / hasara</span><span class="big num ${net >= 0 ? "up" : "dn"}">${money(net, true)}</span><span class="mu sm">${esc(cur())} · ${P.length} trade</span></div>
    ${chart(curve)}
    <div class="kv"><div><span>Win rate</span><b>${P.length ? Math.round(W.length / P.length * 100) + "%" : "—"}</b></div><div><span>Profit factor</span><b>${gl ? (gw / gl).toFixed(2) : W.length ? "∞" : "—"}</b></div><div><span>Wastani R</span><b>${P.length ? (sumR / P.length).toFixed(2) : "—"}</b></div>
      <div><span>Jumla R</span><b class="${sumR >= 0 ? "up" : "dn"}">${sumR >= 0 ? "+" : ""}${sumR.toFixed(1)}</b></div><div><span>Max DD</span><b class="dn">${money(-dd)}</b></div><div><span>Bora</span><b class="up">${P.length ? money(Math.max(...P.map((p) => p.profit)), true) : "—"}</b></div></div></div>
  ${Object.keys(days).length ? Object.entries(days).map(([day, L]) => `<div class="card"><h3>${esc(day)} <span class="num ${L.reduce((s, p) => s + p.profit, 0) >= 0 ? "up" : "dn"}">${money(L.reduce((s, p) => s + p.profit, 0), true)}</span></h3><div class="lst">${L.map((p) => `<div class="it"><span class="side ${p.side}">${p.side}</span>
      <div><b class="sm">${esc(p.reason)}</b>${p.parts > 1 ? ` <span class="pill">partial ×${p.parts - 1}</span>` : ""}<div class="xs mu">${hm(p.t)}${p.symbol ? " · " + esc(p.symbol) : ""}</div></div>
      <div style="text-align:right"><b class="num ${p.profit >= 0 ? "up" : "dn"}">${money(p.profit, true)}</b><div class="xs num ${p.r >= 0 ? "up" : "dn"}">${p.r >= 0 ? "+" : ""}${p.r.toFixed(2)}R</div></div></div>`).join("")}</div></div>`).join("")
    : `<div class="card"><div class="empty">Bado hakuna trade iliyofungwa kwenye kipindi hiki.</div></div>`}`;
}
function chart(c) {
  if (c.length < 2) return `<div class="empty xs">Mchoro wa equity utaonekana baada ya trade kufungwa.</div>`;
  const W = 520, H = 120, mn = Math.min(...c, 0), mx = Math.max(...c, 0.01), y = (v) => H - 8 - (v - mn) / (mx - mn || 1) * (H - 16), x = (i) => i / (c.length - 1) * W;
  const d = c.map((v, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(v).toFixed(1)).join(" "), col = c[c.length - 1] >= 0 ? "var(--up)" : "var(--dn)";
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;height:auto" role="img" aria-label="Mchoro wa faida"><line x1="0" x2="${W}" y1="${y(0)}" y2="${y(0)}" stroke="var(--ln)" stroke-dasharray="3 3"/><path d="${d} L${W} ${y(0)} L0 ${y(0)} Z" fill="${col}" opacity=".12"/><path d="${d}" fill="none" stroke="${col}" stroke-width="2"/><circle cx="${x(c.length - 1)}" cy="${y(c[c.length - 1])}" r="3.5" fill="${col}"/></svg>`;
}
function vSignals() {
  return `<div class="card"><h3>Signal za robot <span class="pill">${S.signals.length}</span></h3>${S.signals.length ? `<div class="lst">${S.signals.map((s) => `<div class="it"><span class="side ${s.side}">${s.side}</span>
    <div style="min-width:0"><b class="num sm">Entry ${px(s.entry)}</b><div class="xs mu num">SL ${px(s.sl)} · TP ${px(s.tp)} · 1:${(s.rr || 0).toFixed(1)}</div><div class="xs mu">${dstr(s.t)} ${hm(s.t)}${s.kz ? " · " + esc(s.kz) : ""}</div></div>
    <div style="text-align:right;display:grid;gap:4px;justify-items:end"><span class="pill ${s.score >= 80 ? "up" : "gold"}">${Math.round(s.score)}</span>${s.auto ? `<span class="pill up">traded</span>` : `<span class="pill">alert</span>`}</div></div>`).join("")}</div>` : `<div class="empty">Signal zitaonekana hapa robot ikiziona. Zinakuja tu vigezo vikitimia — inaweza kuchukua masaa.</div>`}</div>`;
}
function vControl() {
  const st = S.st || {}, c = S.ctl || {};
  const auto = c.auto != null ? c.auto : st.auto, paused = c.paused != null ? c.paused : st.paused, risk = c.risk != null ? c.risk : st.risk || 1;
  const pend = st.t && c.at && c.at > st.t;
  return `<div class="card"><h3>Udhibiti wa robot ${pend ? `<span class="pill gold">inasubiri robot…</span>` : `<span class="pill up">imepokelewa</span>`}</h3>
    <div class="ctl"><div class="t"><b>Auto-trading</b><span>Robot ifungue trade yenyewe. Ikizimwa, inatuma signal tu.</span></div><button class="tg ${auto ? "on" : ""}" aria-pressed="${!!auto}" aria-label="Auto-trading" onclick="setCtl({auto:${!auto}})"></button></div>
    <div class="ctl"><div class="t"><b>Simamisha kwa muda (pause)</b><span>Hakuna trade mpya. Trade zilizo wazi zinaendelea kulindwa.</span></div><button class="tg warn ${paused ? "on" : ""}" aria-pressed="${!!paused}" aria-label="Pause" onclick="setCtl({paused:${!paused}})"></button></div>
    <div class="ctl"><div class="t"><b>Risk kwa kila trade</b><span>Asilimia ya balance (0.25% – 5%).</span></div>
      <div class="step"><button onclick="setCtl({risk:Math.max(0.25,+(${risk}-0.25).toFixed(2))})" aria-label="Punguza">−</button><b class="num" style="min-width:56px;text-align:center">${Number(risk).toFixed(2)}%</b><button onclick="setCtl({risk:Math.min(5,+(${risk}+0.25).toFixed(2))})" aria-label="Ongeza">＋</button></div></div>
    <button class="btn d full" onclick="closeAllSheet()" ${(st.positions || []).length ? "" : "disabled"}>Funga trade zote sasa</button>
    <p class="xs mu" style="margin:0">Amri zinafika robot ndani ya sekunde ~10, mradi MT5 iko wazi. Hali halisi ya robot sasa: ${st.paused ? "PAUSED" : st.auto ? "AUTO" : "SIGNALS"}, risk ${(st.risk || 0).toFixed(2)}%.</p></div>
  <div class="card"><h3>Ulinzi uliowekwa kwenye EA</h3><div class="kv"><div><span>Hasara/siku</span><b>${st.maxDailyLoss || 0}%</b></div><div><span>Trade/siku</span><b>${st.maxTrades || 0}</b></div><div><span>Alama min</span><b>${st.minScore || 0}</b></div></div>
    <p class="xs mu" style="margin:0">Break-even, partial close na trailing vinabadilishwa kwenye Inputs za EA ndani ya MT5.</p></div>`;
}
function vAcct() {
  const nk = S.newKey && S.newKey.login === S.acct ? S.newKey.key : S.key;
  return `<div class="card"><h3>Akaunti za MT5 <button class="btn" style="padding:6px 10px" onclick="connectSheet()">＋ Ongeza</button></h3>
    ${S.accts.length || S.acct ? `<div class="lst">${[...new Set(S.accts.map((a) => a.id).concat(S.acct ? [S.acct] : []))].map((id) => { const a = S.accts.find((x) => x.id === id) || {}; return `<div class="it" style="cursor:pointer" onclick="S.acct='${esc(id)}';watch('${esc(id)}');render()"><span class="pill ${id === S.acct ? "gold" : ""}">${id === S.acct ? "●" : "○"}</span><div><b class="num">${esc(id)}</b><div class="xs mu">${esc(a.name || "inasubiri robot")} ${a.server ? "· " + esc(a.server) : ""}</div></div><span class="xs ${a.t && Date.now() - a.t < 90e3 ? "up" : "mu"}">${a.t ? (Date.now() - a.t < 90e3 ? "Live" : ago(a.t)) : "—"}</span></div>`; }).join("")}</div>` : `<div class="empty">Bado hakuna akaunti.</div>`}</div>
  ${S.acct ? `<div class="card"><h3>Kuunganisha robot ya ${esc(S.acct)}</h3>
    <p class="sm" style="margin:0">Sync key ya akaunti hii:</p>${nk ? `<code class="k" id="keytxt">${esc(nk)}</code><button class="btn" onclick="copyKey()">📋 Nakili key</button>` : `<p class="mu sm" style="margin:0">Key haijatengenezwa. Bonyeza "＋ Ongeza" na uweke namba hii.</p>`}
    <ol class="steps"><li>MT5 (kompyuta): <b>Tools → Options → Expert Advisors</b> → weka ✓ <b>Allow WebRequest</b> na ongeza: <code class="num gold">https://firestore.googleapis.com</code></li>
      <li>Weka EA <b>QuantVision_SMC_EA v1.21</b> kwenye chati ya XAUUSD M5.</li>
      <li>Kwenye <b>Inputs</b>: <b>InpSyncKey</b> = key hiyo hapo juu.</li>
      <li>Ndani ya sekunde 10 hali itakuwa <span class="pill up live"><span class="dot"></span>Live</span>.</li></ol>
    <p class="xs mu" style="margin:0">MT5 lazima ibaki wazi na ina mtandao (kompyuta au VPS). App hii inaonyesha tu kile robot inatuma.</p></div>` : ""}
  <div class="card"><h3>Wewe</h3><div class="row between"><span class="sm">${esc(S.user.email)}</span><button class="btn" onclick="auth.signOut().then(()=>location.reload())">Toka</button></div>
    <p class="xs mu" style="margin:0">Ili kuisakinisha kama app: Chrome ⋮ → <b>Add to Home screen</b> (Android) au Share → <b>Add to Home Screen</b> (iPhone).</p></div>`;
}
function copyKey() { const t = ($("#keytxt") || {}).textContent || ""; (navigator.clipboard ? navigator.clipboard.writeText(t) : Promise.reject()).then(() => toast("📋 Key imenakiliwa")).catch(() => { const r = document.createRange(); r.selectNodeContents($("#keytxt")); getSelection().removeAllRanges(); getSelection().addRange(r); toast("Chagua key kisha nakili"); }); }

const TABS = [["home", "🏠", "Dashibodi"], ["trades", "📈", "Trade"], ["signals", "⚡", "Signal"], ["control", "🎛️", "Udhibiti"], ["acct", "👤", "Akaunti"]];
function render() {
  const app = $("#app");
  if (!S.ready) return;
  if (!S.user || (S.user.email || "").toLowerCase() !== ADMIN) { app.innerHTML = vLogin(); return; }
  if (!S.loaded) { app.innerHTML = `<div class="login"><div class="box"><p class="mu">Inapakia akaunti…</p></div></div>`; return; }
  const body = S.loadErr ? `<div class="card" style="border-color:var(--dn)"><b class="dn">Haiwezi kusoma data</b><span class="sm">${esc(S.loadErr)}</span></div>` + vAcct()
    : S.tab === "home" ? vHome() : S.tab === "trades" ? vTrades() : S.tab === "signals" ? vSignals() : S.tab === "control" ? vControl() : vAcct();
  const y = window.scrollY;
  app.innerHTML = header() + `<main class="wrap">${body}</main>
    <nav class="tabs" aria-label="Kurasa"><div class="in">${TABS.map(([k, i, l]) => `<button class="${S.tab === k ? "on" : ""}" onclick="S.tab='${k}';render();window.scrollTo(0,0)" aria-current="${S.tab === k}"><i>${i}</i>${l}</button>`).join("")}</div></nav>`;
  window.scrollTo(0, y);
}
setInterval(() => { if (S.user && S.st) render(); }, 15000);   // keep "Live / Offline" and "ago" fresh
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(() => {});
</script>
</body>
</html>
